<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>上下五千年 · 无尽编年</title>
<style>/* 上下五千年 · 无尽编年 —— 样式表（构建时内联） */
:root{
  --bg:#14110e; --paper:#211c16; --paper2:#2b241b; --line:#4a3c2a;
  --ink:#e8dcc2; --dim:#a9977c; --red:#b8472f; --red2:#d96a44;
  --gold:#c9a227; --green:#6e9b6b; --blue:#6f8fa8;
}
:root{--fs:1}
html{font-size:calc(16px * var(--fs))}
html.hc{--ink:#fff4dc;--dim:#dcc9a4;--line:#8a7550;--paper:#2a2116;--paper2:#382c1d;--gold:#ffd75e;--blue:#9ec8e8;--green:#9fd39a}
html.hc .card,html.hc .head,html.hc .volbar,html.hc .st{background:#241c12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button.pill{cursor:pointer;font-family:inherit;background:#1d1811;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 9px;font-size:calc(11px * var(--fs));margin:2px 3px 2px 0}
button.pill.on{border-color:var(--gold);background:#33291a;color:var(--gold)}
.tierbar,.warnbar{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;
  padding:9px 12px;margin-top:10px;background:linear-gradient(90deg,#241c12,var(--paper));
  font-size:calc(12px * var(--fs));color:var(--ink)}
.warnbar{border-left-color:var(--red2);background:linear-gradient(90deg,#3a1c18,var(--paper))}
.warnbar b{color:var(--red2)}
.note.red{border-left:3px solid var(--red2);background:#3a1c18;color:#ffd9d2}
.fringecard{border:1px dashed var(--red2);border-radius:10px;padding:11px;margin-top:8px;background:#2a1714}
.mapbox{position:relative;width:100%;height:190px;border:1px solid var(--line);border-radius:10px;
  margin-top:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#23303a,#151a20)}
.mapbox i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 6px var(--gold);transform:translate(-50%,-50%)}
.mapbox i.far{background:var(--blue);box-shadow:0 0 5px var(--blue)}
.mapbox .eq{position:absolute;left:0;right:0;top:50%;border-top:1px dashed #4a5a66;opacity:.5}
.mapbox .pm{position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed #4a5a66;opacity:.35}
.atlasbox{height:320px;cursor:grab;touch-action:none;background:#10171d}
.atlasbox:active{cursor:grabbing}
.atlasbox canvas{display:block;width:100%;height:100%}
.tlwrap{position:relative;height:44px;margin:14px 4px 2px}
.tlbase{position:absolute;left:0;right:0;top:20px;height:3px;background:linear-gradient(90deg,#4a3c28,var(--gold));border-radius:2px}
.tlvol{position:absolute;top:9px;width:1px;height:25px;background:rgba(230,210,160,.55)}
.tlmark{position:absolute;top:16px;width:7px;height:7px;border-radius:50%;
  border:1px solid rgba(0,0,0,.55);transform:translateX(-3px);cursor:help}
.tlnow{position:absolute;top:6px;width:2px;height:31px;background:#ffdf8a;transform:translateX(-1px);
  box-shadow:0 0 6px rgba(255,223,138,.7)}
.tlrow{display:flex;justify-content:space-between;font-size:calc(10.5px * var(--fs));color:var(--dim);margin:0 4px}
.layerbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.layerbar button{border:1px solid var(--line);border-radius:8px;background:#1a1c19;
  color:var(--dim);font-family:inherit;font-size:calc(12px * var(--fs));padding:6px 11px;cursor:pointer}
.layerbar button.on{border-color:var(--gold);background:#33291a;color:var(--gold)}
.layerbar button:active{transform:translateY(1px)}
.maptools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.maptools button{border:1px solid var(--line);border-radius:8px;background:#241c12;
  color:var(--gold);font-family:inherit;font-size:calc(12px * var(--fs));padding:6px 11px;cursor:pointer}
.maptools button:hover{border-color:var(--gold);background:#33291a}
.maptools button:active{transform:translateY(1px)}
.yearbar{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:calc(12px * var(--fs));color:var(--dim)}
.yearbar b{color:var(--gold);min-width:104px;text-align:right;font-weight:400}
.yearbar input[type=range]{flex:1;min-width:120px;accent-color:var(--gold);cursor:pointer}
#atlasList .row{margin-top:6px}
#atlasPick{font-size:calc(12px * var(--fs))}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
  -webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(circle at 20% 0%,#2a2218 0%,transparent 55%),
  radial-gradient(circle at 90% 100%,#1d201d 0%,transparent 50%);min-height:100vh}
#app{max-width:660px;margin:0 auto;padding:14px 14px 96px;position:relative}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(160deg,#2c241a,#1c1812)}
.yr{font-size:calc(24px * var(--fs));letter-spacing:1px;color:var(--gold);font-weight:700;line-height:1.2}
.era{font-size:calc(12px * var(--fs));color:var(--dim);margin-top:3px;letter-spacing:2px}
.badge{font-size:calc(11px * var(--fs));color:var(--ink);border:1px solid var(--line);
  border-radius:20px;padding:5px 9px;white-space:nowrap;background:#191510;text-align:right}
.volbar{border:1px solid var(--line);border-radius:10px;background:#1b1710;
  padding:9px 12px;margin-top:8px}
.vt{font-size:calc(12px * var(--fs));color:var(--gold);letter-spacing:1px}
.vbar{height:4px;background:#3a3022;border-radius:3px;margin:7px 0 6px;overflow:hidden}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .35s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.st{background:var(--paper);border:1px solid #3a3022;border-radius:9px;padding:7px 8px}
.st b{display:block;font-size:calc(15px * var(--fs));color:var(--ink);font-weight:600}
.st span{font-size:calc(10px * var(--fs));color:var(--dim);letter-spacing:1px}
.bar{height:3px;background:#3a3022;border-radius:2px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .35s}
.card{border:1px solid var(--line);border-radius:14px;background:
  linear-gradient(170deg,var(--paper2),var(--paper));padding:16px;margin-top:10px;
  box-shadow:0 8px 28px #0006;animation:cardin .28s ease-out both}
@keyframes cardin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}

.gather b{color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{width:100%;text-align:left;border:1px solid #55442f;border-radius:11px;

.opt:active{transform:scale(.985);border-color:var(--red2);background:#3a2b1e}
.opt .t{font-size:calc(15px * var(--fs));font-weight:600;display:block;line-height:1.45}
.opt .e{font-size:calc(11px * var(--fs));color:var(--green);margin-top:5px;letter-spacing:.5px}
.opt .k{font-size:calc(10px * var(--fs));color:var(--dim);float:right;margin-top:2px}
.opt.rich{padding:11px 13px 12px;min-height:0}
.opt.rich .optbody{display:block;margin-right:18px}
.opt.rich .badge{display:inline-block;font-size:calc(10px * var(--fs));letter-spacing:1px;

.opt.rich .t{font-size:calc(14px * var(--fs));font-weight:600;line-height:1.5}
.opt.rich .basis{display:block;font-size:calc(10.5px * var(--fs));color:#a9c8dc;margin-top:5px;line-height:1.5}
.opt.rich .basis.seek{color:#d8c07a}
.opt.rich .estat{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:calc(11px * var(--fs));

.opt.rich .estat i{font-style:normal}
.opt.rich .estat .gain{color:var(--green)}
.opt.rich .estat .cost{color:var(--red2)}
.opt.rich .risk{display:block;font-size:calc(10.5px * var(--fs));color:#e0a06a;margin-top:5px}
.opt.rich .req{display:block;font-size:calc(10px * var(--fs));color:var(--dim);margin-top:4px}
.result{border-left:3px solid var(--red2);padding:10px 12px;margin:12px 0 0;

.big{width:100%;margin-top:12px;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--red),#8d2f20);color:#fff6e8;
  font-size:calc(16px * var(--fs));font-weight:700;letter-spacing:3px;cursor:pointer;font-family:inherit;

.big:active{filter:brightness(1.15)}
.big.alt{background:linear-gradient(135deg,#5a4a2c,#3a2f1c);font-size:calc(14px * var(--fs));letter-spacing:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#100e0bdd;backdrop-filter:blur(8px);

.tabs button{flex:1;background:none;border:none;color:var(--dim);padding:12px 2px;
  font-size:calc(11px * var(--fs));font-family:inherit;cursor:pointer;letter-spacing:1px}
.tabs button.on{color:var(--gold);border-top:2px solid var(--gold)}
.panel{display:none;margin-top:10px}
.panel.on{display:block}
.row{padding:9px 2px;border-bottom:1px dotted #3d3223;font-size:calc(13px * var(--fs));line-height:1.7}
.row .y{color:var(--gold);font-size:calc(11px * var(--fs));margin-right:8px}
.row .s{color:var(--dim)}
.mini{font-size:calc(11px * var(--fs));color:var(--dim);line-height:1.7}
.hr{height:1px;background:var(--line);margin:14px 0;opacity:.5}
.sel{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.sel button,.viewsel button{border:1px solid var(--line);background:#1d1811;color:var(--ink);

.sel button.on,.viewsel button.on{border-color:var(--gold);background:#33291a;color:var(--gold)}
.viewsel{display:flex;gap:8px;margin:10px 0}
.viewsel button{flex:1}
.title{text-align:center;padding:26px 0 6px}
.title h1{font-size:calc(28px * var(--fs));letter-spacing:6px;margin:0;color:var(--gold)}
.title p{font-size:calc(12px * var(--fs));color:var(--dim);letter-spacing:2px;margin:10px 0 0}
.intro{font-size:calc(14px * var(--fs));line-height:1.9;color:#d3c5a8;text-align:center;padding:8px 6px}
.pill{display:inline-block;font-size:calc(10px * var(--fs));border:1px solid var(--line);border-radius:20px;

.center{text-align:center}

/* 新手教程 / 难度指引 */
.tutcard{margin:8px 0;padding:12px 14px;border:1px solid var(--gold);border-radius:12px;

.tuthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tuthead b{color:var(--gold);letter-spacing:.06em}
.tutbar{height:5px;background:#151009;border-radius:4px;overflow:hidden;margin-top:7px}
.tutbar i{display:block;height:100%;background:var(--gold)}
.tutbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

.opt.suggested{border-color:var(--gold)}

.tuton label{display:flex;align-items:center;gap:7px;font-size:calc(13px * var(--fs));color:var(--ink)}

.ppsearch{width:100%;box-sizing:border-box;margin:8px 0 4px;padding:8px 10px;

.kgn.dim{opacity:.34}

<script>
"use strict";
/* ===== src/rng.js ===== */
/* rng.js —— 确定性随机（借鉴 The Inheritance Game / Minerva 的 seeded RNG 思路）
   状态只是一个 uint32，随存档一起序列化，因此「同一 seed + 同一选择序列」必得同一局。 */
(function(W){
  'use strict';
  function hashSeed(s){
    let h=2166136261>>>0;
    s=String(s);
    for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
    return h>>>0;
  }
  // mulberry32 的无闭包版：返回 [0,1) 与新状态
  function next(state){
    let t=(state+0x6D2B79F5)|0;
    let r=Math.imul(t^(t>>>15),1|t);
    r^=r+Math.imul(r^(r>>>7),61|r);
    return [((r^(r>>>14))>>>0)/4294967296,t>>>0];
  }
  W.rng={hashSeed:hashSeed,next:next};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.rng;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));


/* ===== src/kinship.js ===== */
/* kinship.js —— 继嗣制、婚姻、亲属称谓与关系图
   纯逻辑、无 DOM。称谓一律从实际关系链推导，不写死到某个族人。

   核心：开局不一定父系。按文明圈的史料可见做法抽一种继嗣制
   （父系 / 母系 / 双系 / 从妻居入赘），并据此决定开局承祧方、
   子女入哪一支族册、谁为「赘婿」。制度是玩法近似，不是该文明全域断言。 */
(function(W){
  'use strict';
  const D=W.data,K=D.kinship||{systems:[],terms:[],residences:[],meta:{},note_by_region:{}};

  const SYS={},TERM={},RES={};
  K.systems.forEach(s=>SYS[s.key]=s);
  K.terms.forEach(t=>TERM[t.key]=t);
  K.residences.forEach(r=>RES[r.key]=r);

  function pickWeighted(list,rnd){
    let sum=0;list.forEach(x=>sum+=Math.max(0,x.w||0));
    if(sum<=0)return list[0];
    let r=rnd()*sum;
    for(const x of list){r-=Math.max(0,x.w||0);if(r<=0)return x;}
    return list[list.length-1];
  }

  /* ---------- 开局：抽继嗣制，承祧方不一定是父 ---------- */
  function init(S,rnd){
    if(S.kinSystem&&SYS[S.kinSystem.key||S.kinSystem])return S.kinSystem;
    const reg=S.reg||'huaxia';
    const cand=K.systems.map(s=>({key:s.key,w:(s.weight||{})[reg]||0}));
    const chosen=pickWeighted(cand,rnd);
    const s=SYS[chosen.key]||K.systems[0];
    S.kinSystem={key:s.key,name:s.name,short:s.short,desc:s.desc,region:reg};
    S.kinNote=(K.note_by_region||{})[reg]||'';
    S.marriages=S.marriages||[];
    S.kinLog=S.kinLog||[];
    return S.kinSystem;
  }
  function system(S){
    const k=S&&S.kinSystem&&S.kinSystem.key;
    if(k&&SYS[k])return SYS[k];
    /* 旧档兜底：无字段时按文明圈给一个默认，不摇随机 */
    const reg=(S&&S.reg)||'huaxia';
    const fallback=(SYS[reg==='nile'?'matrilineal':reg==='indus'?'bilateral':'patrilineal']
      ||K.systems[0]);
    if(S&&!S.kinSystem)S.kinSystem={key:fallback.key,name:fallback.name,
      short:fallback.short,desc:fallback.desc,region:reg};
    return fallback;
  }
  function isMatri(S){const k=system(S).key;return k==='matrilineal'||k==='uxorilocal';}

  /* ---------- 性别与开局三人 ---------- */
  function seedFamily(S,rnd){
    const mat=isMatri(S);
    const fam=S.fam||[];
    if(!fam.length)return;
    /* 承祧方性别随制度：母系/从妻居由女性当家；父系由男性；双系两者皆可 */
    const head=fam.find(p=>p.id===S.ruler)||fam[0];
    head.gender=mat?'female':(system(S).key==='bilateral'?(rnd()<.5?'female':'male'):'male');
    const others=fam.filter(p=>p.id!==head.id);
    others.forEach((p,i)=>{p.gender=(i===0)
      ?(head.gender==='female'?'male':'female')
      :(rnd()<.5?'male':'female');});
    /* 开局配一对夫妇：第 1 位与第 2 位；第 3 位为其子 */
    if(others.length){
      const a=head,b=others[0];
      marry(S,a,b,rnd);
      const child=others[1];
      if(child){attachBirth(S,child,a,b,rnd);}
    }
    pushLog(S,'开局定继嗣：'+system(S).short+'；承祧方 '+head.name
      +'（'+(head.gender==='female'?'女':'男')+'）。这不是该文明圈的全域断言。');
  }

  function pushLog(S,t){
    S.kinLog=S.kinLog||[];
    S.kinLog.push({y:S.year,t:t});
    if(S.kinLog.length>80)S.kinLog=S.kinLog.slice(-80);
    if(S.mil)S.mil.push({y:S.year,t:'亲属 · '+t});
  }

  /* ---------- 婚姻：夫妇、入赘、居制 ---------- */
  function marry(S,a,b,rnd){
    if(!a||!b||a.id===b.id)return null;
    /* 再配之前，先解开双方旧配偶的单向指向，避免 A→B→C→A 悬空链。
       已经出生的孩子仍保留 parent/parent2，那是出生时的记录，不随再配改写。 */
    [a,b].forEach(p=>{
      const other=(S.fam||[]).find(x=>x.id===p.spouse);
      if(other&&other.id!==(p===a?b.id:a.id)&&other.spouse===p.id)other.spouse=null;
    });
    a.spouse=b.id;b.spouse=a.id;
    if(!a.gender)a.gender=rnd()<.5?'male':'female';
    if(!b.gender)b.gender=a.gender==='male'?'female':'male';
    const sys=system(S);
    let res;
    if(sys.key==='uxorilocal')res='uxorilocal';
    else if(sys.key==='matrilineal')res=(rnd()<.6?'uxorilocal':'bilocal');
    else if(sys.key==='bilateral')res=(rnd()<.5?'neolocal':'bilocal');
    else res=(rnd()<.8?'virilocal':'neolocal');
    a.residence=res;b.residence=res;
    /* 赘婿：从妻居时，夫方标 uxorilocal，妻方为户主 */
    const wife=(a.gender==='female')?a:b;
    const husband=(a.gender==='male')?a:b;
    if(res==='uxorilocal'){
      husband.uxorilocal=true;wife.householdHead=true;
    }else{wife.householdHead=false;husband.uxorilocal=false;}
    S.marriages=S.marriages||[];
    S.marriages.push({y:S.year,a:a.id,b:b.id,an:a.name,bn:b.name,res:res});
    if(S.marriages.length>80)S.marriages=S.marriages.slice(-80);
    pushLog(S,a.name+' 与 '+b.name+' 配为夫妇，'
      +(RES[res]?RES[res].name:res)+(res==='uxorilocal'
        ?'；'+husband.name+' 为赘婿，子女入 '+wife.name+' 一支族册':'')+'。');
    return {a:a,b:b,res:res};
  }

  /* 配偶是否还在册且健在；用于判定「可再配」与「可生育夫妇」 */
  function livingSpouse(S,p){
    if(!p||!p.spouse)return null;
    const q=(S.fam||[]).find(x=>x.id===p.spouse);
    return (q&&q.alive)?q:null;
  }
  /* 每笔给未婚／丧偶在籍成年人配一次对；不额外制造人口，只连关系 */
  function matchUnmarried(S,rnd){
    const alive=(S.fam||[]).filter(p=>p.alive&&p.age>=16&&!livingSpouse(S,p));
    if(alive.length<2)return 0;
    let n=0;
    for(let i=0;i+1<alive.length&&n<2;i+=2){
      const a=alive[i],b=alive[i+1];
      if(marry(S,a,b,rnd))n++;
    }
    return n;
  }

  /* ---------- 可生育夫妇：孩子只从夫妇来 ---------- */
  /* 优先取「世代最高」的一对，让代际真的往下走；同代时优先适龄、其次当家。
     没有现成夫妇但有两位成年人时，现场配一对；一个成年人都没有则返回 null。 */
  function birthCouple(S,rnd,relaxed){
    const fam=S.fam||[];
    /* 远古估寿约 38 岁只是通识级近似，不等于人人 32 岁后不能育；
       窗口放到至少 45 岁，保底添丁时（relaxed）只看是否一对在籍夫妇。 */
    const okAge=p=>relaxed
      ?p.age>=16
      :(p.age>=16&&p.age<=Math.max(45,Math.min(60,(p.life||50)-2)));
    const pairs=[];
    fam.forEach(a=>{
      if(!a.alive||!okAge(a))return;
      const b=livingSpouse(S,a);
      if(!b||!b.alive||!okAge(b)||a.id>b.id)return;   // a.id>b.id 去重
      if(b.spouse!==a.id)return;
      pairs.push({a:a,b:b});
    });
    if(pairs.length){
      pairs.sort((x,y)=>{
        const gx=Math.max(x.a.gen||1,x.b.gen||1),gy=Math.max(y.a.gen||1,y.b.gen||1);
        if(gy!==gx)return gy-gx;                       // 世代高者优先
        const rx=x.a.id===S.ruler||x.b.id===S.ruler?1:0;
        const ry=y.a.id===S.ruler||y.b.id===S.ruler?1:0;
        if(rx!==ry)return rx-ry;
        return (y.a.age+y.b.age)-(x.a.age+x.b.age);
      });
      return pairs[0];
    }
    /* 无现成夫妇：从在籍成年人里配一对，配成才生 */
    const adults=fam.filter(p=>p.alive&&p.age>=16&&!livingSpouse(S,p));
    if(adults.length>=2){
      const a=adults[0],b=adults[1];
      if(marry(S,a,b,rnd))return {a:a,b:b};
    }
    return null;
  }

  /* 族册归属方：母系／从妻居取母，父系取父，双系取年长者 */
  function bookParent(S,a,b){
    const k=system(S).key;
    if(k==='matrilineal'||k==='uxorilocal')
      return (a.gender==='female')?a:b;
    if(k==='bilateral')return (a.age>=b.age)?a:b;
    return (a.gender==='male')?a:b;
  }

  /* ---------- 新生儿：必须挂在一对夫妇上，世代按双亲算 ----------
     旧版这里允许 mate=null、parent2 取 head.spouse（可能为空），
     于是族长一更替就冒出「单亲孩子」；且 gen 用 S.gen+1，
     出现「1 代夫妇生出 3 代孩子」。两处一并修掉。 */
  function attachBirth(S,babe,a,b,rnd){
    if(!babe||!a||!b)return null;
    if(!babe.gender)babe.gender=rnd()<.5?'male':'female';
    /* 双亲必须互为配偶；不是就现场补配，补不成则拒绝这个孩子 */
    if(a.spouse!==b.id||b.spouse!==a.id){
      if(!marry(S,a,b,rnd))return null;
    }
    babe.parent=a.id;babe.parent2=b.id;
    /* 出生时的夫妇快照：日后父母丧偶再配、或一方离册，都不改写这条出生记录 */
    babe.birthPair=[a.id,b.id];
    babe.birthSpouseOK=true;
    babe.gen=Math.max(a.gen||1,b.gen||1)+1;
    const bp=bookParent(S,a,b);
    babe.fromName=bp?bp.name:(a.name||'');
    babe.bookParent=bp?bp.id:null;
    babe.birthKin=system(S).key;
    babe.birthRes=bp?bp.residence:null;
    babe.skills=babe.skills||[];
    if(bp&&bp.uxorilocal)babe.viaUxorilocal=true;
    return babe;
  }

  /* ---------- 旧档校正：补双亲、重算世代 ---------- */
  function normalize(S){
    const fam=S.fam||[];
    if(!fam.length)return {fixed:0,regen:0};
    const m={};fam.forEach(p=>m[p.id]=p);
    let fixed=0,regen=0;
    /* 1 补 parent2：优先用 parent 的在册配偶；否则同代找一位配给 parent */
    fam.forEach(p=>{
      if(!p.parent)return;
      const a=m[p.parent];
      if(!a){p.parent=null;p.parent2=null;p.birthNote='旧档父辈已不在册';return;}
      let b=p.parent2?m[p.parent2]:null;
      /* parent2 已在册就保留：那可能是已故／离册的另一方，或后来再配的前配偶，
         都是出生时的真实记录，不该被「现在是否仍为夫妇」抹掉。 */
      if(b&&b.id!==a.id){p.birthPair=p.birthPair||[a.id,b.id];return;}
      const live=livingSpouse(S,a);
      if(live&&live.id!==a.id){b=live;fixed++;}
      else{
        /* 找同代、无活配偶的另一位成年人补配 */
        const cand=fam.find(q=>q.id!==a.id&&q.gen===a.gen&&!livingSpouse(S,q));
        if(cand){
          a.spouse=cand.id;cand.spouse=a.id;
          a.gender=a.gender||'male';cand.gender=cand.gender||(a.gender==='male'?'female':'male');
          a.residence=a.residence||'virilocal';cand.residence=cand.residence||a.residence;
          b=cand;fixed++;
        }
      }
      if(b&&b.id!==a.id){p.parent2=b.id;p.birthPair=[a.id,b.id];}
      else{p.parent2=null;p.birthNote='旧档未记双亲，仅存一方';}
    });
    /* 2 世代按双亲 +1 重算，两轮迭代让祖孙链也稳下来 */
    for(let round=0;round<2;round++){
      fam.forEach(p=>{
        const a=p.parent?m[p.parent]:null,b=p.parent2?m[p.parent2]:null;
        if(!a&&!b)return;
        const g=Math.max(a?a.gen||1:0,b?b.gen||1:0)+1;
        if(g>=1&&p.gen!==g){p.gen=g;regen++;}
      });
    }
    if(fixed||regen){
      S.kinLog=S.kinLog||[];
      S.kinLog.push({y:S.year,t:'【旧档校正】补记双亲 '+fixed+' 处、按亲子链重算世代 '
        +regen+' 处；此后孩子只从已配对的夫妇出生。'});
    }
    return {fixed:fixed,regen:regen};
  }

  /* ---------- 关系推导 ---------- */
  function byId(S){const m={};(S.fam||[]).forEach(p=>m[p.id]=p);return m;}
  const nm=p=>p?p.name:'（已不在册）';
  const genderOf=p=>p&&p.gender?p.gender:'unknown';

  function siblingsOf(S,p,m){
    if(!p)return [];
    const ids=new Set([p.parent,p.parent2].filter(Boolean));
    if(!ids.size)return [];
    return (S.fam||[]).filter(x=>x.id!==p.id&&x.gen===p.gen
      &&([x.parent,x.parent2].some(q=>q&&ids.has(q))));
  }
  function childrenOf(S,p,m){
    if(!p)return [];
    return (S.fam||[]).filter(x=>x.id!==p.id
      &&(x.parent===p.id||x.parent2===p.id));
  }

  function relationsOf(S,p){
    const m=byId(S),out=[],seen=new Set();
    const add=(key,who,kind,note)=>{
      if(!who)return;
      const t=TERM[key]||{term:key};
      const sig=t.term+'|'+who.id;
      if(seen.has(sig))return;seen.add(sig);
      out.push({key:key,term:t.term,who:who.id,whoName:nm(who),
        kind:kind||t.kind,note:note||t.note||''});
    };
    /* 配偶 */
    const sp=p.spouse?m[p.spouse]:null;
    if(sp){
      add(genderOf(p)==='female'?'husband':'wife',sp,'affine',
        p.residence==='uxorilocal'?'从妻居 / 入赘':undefined);
      if(p.residence==='uxorilocal')add('uxorilocal_husband',sp,'affine');
    }
    /* 双亲 */
    const par=p.parent?m[p.parent]:null,par2=p.parent2?m[p.parent2]:null;
    const parents=[par,par2].filter(Boolean);
    parents.forEach(q=>{
      add(genderOf(q)==='female'?'mother':'father',q,'blood');
      /* 祖辈 */
      [q.parent,q.parent2].filter(Boolean).forEach(g=>{
        const gg=m[g];if(!gg)return;
        const paternal=(genderOf(q)==='male');
        add(paternal?(genderOf(gg)==='male'?'paternal_grandfather':'paternal_grandmother')
                    :(genderOf(gg)==='male'?'maternal_grandfather':'maternal_grandmother'),
            gg,'blood');
      });
    });
    /* 子女 */
    const ch=childrenOf(S,p,m);
    ch.forEach(c=>{
      add(genderOf(c)==='female'?'daughter':'son',c,'blood');
      if(c.role==='heir')add('heir',c,'descent');
      /* 孙辈：外孙与孙区分 */
      const cg=childrenOf(S,c,m);
      cg.forEach(g=>{
        if(genderOf(c)==='female')
          add(genderOf(g)==='female'?'daughter_daughter':'daughter_son',g,'blood');
        else add(genderOf(g)==='female'?'granddaughter':'grandson',g,'blood');
      });
      /* 亲家 */
      if(c.spouse&&m[c.spouse]){
        [m[c.spouse].parent,m[c.spouse].parent2].filter(Boolean).forEach(x=>{
          if(m[x])add('in_laws',m[x],'affine');
        });
      }
    });
    /* 同辈 */
    const sib=siblingsOf(S,p,m);
    const elder=x=>x.age>p.age;
    sib.forEach(s=>{
      const male=genderOf(s)==='male';
      add(male?(elder(s)?'elder_brother':'younger_brother')
              :(elder(s)?'elder_sister':'younger_sister'),s,'blood');
      /* 嫂 / 弟媳 / 姊夫 / 妹夫 */
      if(s.spouse&&m[s.spouse])
        add(male?(elder(s)?'brother_wife_elder':'brother_wife_younger')
                :'sister_husband',m[s.spouse],'affine');
      /* 侄 / 甥 */
      childrenOf(S,s,m).forEach(c=>{
        if(male)add(genderOf(c)==='female'?'niece':'nephew',c,'blood');
        else add(genderOf(c)==='female'?'sister_daughter':'sister_son',c,'blood');
      });
    });
    /* 伯叔姑舅姨 + 其配偶（姑父、舅母、姨父…）+ 堂表 */
    parents.forEach(q=>{
      siblingsOf(S,q,m).forEach(u=>{
        const male=genderOf(u)==='male';
        const paternal=(genderOf(q)==='male');
        if(paternal){
          add(male?(u.age>q.age?'paternal_uncle_elder':'paternal_uncle_younger')
                  :'paternal_aunt',u,'blood');
          if(u.spouse&&m[u.spouse])
            add(male?'paternal_uncle_wife':'paternal_aunt_husband',m[u.spouse],'affine');
        }else{
          add(male?'maternal_uncle':'maternal_aunt',u,'blood');
          if(u.spouse&&m[u.spouse])
            add(male?'maternal_uncle_wife':'maternal_aunt_husband',m[u.spouse],'affine');
        }
        childrenOf(S,u,m).forEach(c=>{
          add(paternal?(male?'paternal_cousin':'maternal_cousin_fu')
                      :(male?'maternal_cousin_jiu':'maternal_cousin_yi'),c,'blood');
        });
      });
    });
    /* 配偶之血亲与同辈姻亲 */
    if(sp){
      [sp.parent,sp.parent2].filter(Boolean).forEach(q=>{
        const x=m[q];if(!x)return;
        add(genderOf(p)==='female'
          ?(genderOf(x)==='male'?'husband_father':'husband_mother')
          :(genderOf(x)==='male'?'father_in_law':'mother_in_law'),x,'affine');
      });
      siblingsOf(S,sp,m).forEach(u=>{
        const male=genderOf(u)==='male';
        if(genderOf(p)==='female')
          add(male?(u.age>sp.age?'husband_brother':'husband_brother'):'husband_sister',u,'affine');
        else add(male?(u.age>sp.age?'wife_brother_elder':'wife_brother_younger')
                    :'wife_sister',u,'affine');
      });
    }
    /* 连襟 / 妯娌：本人与同辈的配偶互称 */
    sib.forEach(s=>{
      if(!s.spouse||!m[s.spouse]||!sp)return;
      if(genderOf(s)==='female')add('co_brothers_in_law',m[s.spouse],'affine','姊妹之夫互称');
      else add('co_sisters',m[s.spouse],'affine','兄弟之妻互称');
    });
    /* 继嗣制度读法 */
    const sys=system(S);
    /* 制度读法只写文字，不画成「自己连自己」的边 */
    out.push({key:p.id===S.ruler?'lineage_heir':'cadet',
      term:p.id===S.ruler?'宗子 / 嫡长':'庶支 / 旁支',who:null,whoName:'',
      kind:'descent',note:'本局 '+sys.short});
    if(p.residence&&RES[p.residence])
      out.push({key:p.residence,term:RES[p.residence].name,who:p.id,
        whoName:nm(p),kind:'household',note:RES[p.residence].note});
    if(p.uxorilocal)
      out.push({key:'uxorilocal',term:'赘婿',who:p.id,whoName:nm(p),
        kind:'affine',note:'从妻居的夫；本局只改居住与族册归属，不改其本姓'});
    return out;
  }

  /* 穷举册：全表称谓 × 本局是否出现 */
  function termCoverage(S){
    const live=(S.fam||[]).filter(p=>p.alive);
    const got=new Set();
    live.forEach(p=>relationsOf(S,p).forEach(r=>got.add(r.key)));
    return K.terms.map(t=>({key:t.key,term:t.term,kind:t.kind,
      note:t.note||'',present:got.has(t.key)}));
  }

  /* ---------- 关系图 ---------- */
  function graph(S){
    const fam=(S.fam||[]).slice(-16);
    const ids=new Set(fam.map(p=>p.id));
    const nodes=fam.map(p=>({id:p.id,name:p.name,gen:p.gen||1,
      gender:p.gender||'unknown',alive:!!p.alive,ruler:p.id===S.ruler,
      age:p.age||0,trait:p.trait||''}));
    const edges=[],seen=new Set();
    fam.forEach(p=>relationsOf(S,p).forEach(r=>{
      if(!ids.has(r.who)||r.who===p.id)return;
      const sig=[p.id,r.who].sort().join('|')+'|'+r.term;
      if(seen.has(sig))return;seen.add(sig);
      edges.push({a:p.id,b:r.who,term:r.term,kind:r.kind});
    }));
    return {nodes:nodes,edges:edges,system:system(S)};
  }

  function summary(S){
    const live=(S.fam||[]).filter(p=>p.alive);
    let rels=0;live.forEach(p=>rels+=relationsOf(S,p).length);
    const cov=termCoverage(S);
    return {system:system(S).short,systemName:system(S).name,
      marriages:(S.marriages||[]).length,
      uxorilocal:live.filter(p=>p.uxorilocal).length,
      relations:rels,termsTotal:K.terms.length,
      termsPresent:cov.filter(x=>x.present).length,
      femaleHeads:live.filter(p=>p.id===S.ruler&&p.gender==='female').length,
      logs:(S.kinLog||[]).length};
  }

  W.kinship={SYS:SYS,TERM:TERM,RES:RES,init:init,system:system,isMatri:isMatri,
    seedFamily:seedFamily,marry:marry,matchUnmarried:matchUnmarried,
    livingSpouse:livingSpouse,birthCouple:birthCouple,bookParent:bookParent,
    attachBirth:attachBirth,normalize:normalize,
    relationsOf:relationsOf,termCoverage:termCoverage,
    graph:graph,summary:summary,pushLog:pushLog};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.kinship;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));

/* family.js —— 家族世代与继承算法
   参考《王朝》开源项目的嫡长 / 兄终弟及 / 旁支过继分层，以及 Minerva / Life Sim 的世代模型。
   不依赖 DOM，可在 node 里单独跑逻辑测试。

   寿数模型（本轮修订）：一笔推演常跨数十至百余年，那是「编年跨过的岁月」，
   不是同一个人活过的年数。内部按约 25 年一代切成小段推进，每人有按出生年代
   估算的寿数，超过即凋零、由下一代接续；日志与族谱只显示人的实际年岁。 */
(function(W){
  'use strict';
  const D=W.data;
  const GEN_YEARS=25;          // 一代约 25 年

  function makeName(reg,gen,rnd,pick){
    const R=D.regions[reg];
    if(reg==='huaxia'||reg==='steppe')
      return pick(R.sur)+pick(R.giv)+(gen>2&&rnd()<.25?pick(['之','儿','生','公']):'');
    if(reg==='maya')return pick(R.sur)+'·'+pick(R.giv);
    return pick(R.giv)+(rnd()<.4?'·'+pick(R.sur):'');
  }
  function newPerson(reg,gen,role,rnd,pick){
    return {id:'p'+Math.floor(rnd()*1e9).toString(36),
      name:makeName(reg,gen,rnd,pick),gen:gen,
      age:role==='heir'?Math.floor(rnd()*8):Math.floor(18+rnd()*22),

  function baseLife(born){
    if(born<-3000)return 38;
    if(born<-1000)return 43;

  function lifeAt(S,born,trait,rnd){

  function ensureLife(S,p,rnd){
    if(p.age>90)p.age=20+Math.floor(rnd()*22);

    if(!pool.length){pool=alive.filter(p=>p.gen===g).sort(byAge);type='兄终弟及';}
    if(!pool.length){pool=alive.filter(p=>p.gen>g).sort((a,b)=>a.gen-b.gen||byAge(a,b));type='旁支过继';}

      const want=Math.max(1,Math.min(birthBudget,
        Math.round(slice/GEN_YEARS*(0.9+S.st.people/70))));
      const head=S.fam.find(p=>p.id===S.ruler);

      else{
        const g=Math.max(1,...S.fam.map(p=>p.gen||1));
        const adult=newPerson(S.reg,g,'member',rnd,pick);

        adult.born=Math.round(S.year-adult.age);
        adult.life=lifeAt(S,adult.born,adult.trait,rnd);

        adult.birthNote='旧档／绝嗣补员：成年人入册，无双亲记载';
        S.fam.push(adult);births++;

/* people.js —— 族人生平 / 技能 / 传承 / 史册对照

(function(W){

     标清来源，不冒充这个人真的做过该业。 */
  function recordSkill(S,job){
    if(!job||!S)return null;

    if(!alive.length)return null;
    const head=alive.find(p=>p.id===S.ruler)||alive[0];

    const person=(u((S.year||0)+':'+head.id+':'+job)<.55)
      ?head:pick(alive,Math.floor(u((S.year||0)+'#'+job)*alive.length));

    if(person.skills.indexOf(job)<0&&person.skills.length<8)person.skills.push(job);

  function skillsOf(S,p){

    /* 承袭只给「父辈有业、本人未亲习」的读法：派生出 1—2 条，明确标为承袭 */

    /* ensureLife 需要 rnd；这里只读不补，避免渲染改随机状态。

    if(lin.children.length)lines.push('名下子嗣 '+lin.children.length+' 人'+(lin.heir?('，在籍 '+lin.heir+' 人'):'')+'。');
    if(lin.rules.length)lines.push('继立：'+lin.rules.map(r=>r.t.replace('族长更替 · ','')).join('；')+'。');
    if(lin.debts.length)lines.push('由本人了结的族谱旧账 '+lin.debts.length+' 笔（全为推演）。');
    return lines;
  }

  /* ---------- 是不是历史名人 ---------- */
  /* 结论恒定：本局族人是推演生成的人物，不是史实人物。
     只做「姓名用字是否与册中人物重合」的检索，并明确同名不等于同一人。 */
  function historyCheck(S,p){
    const name=String(p.name||'');
    const chars=[...new Set(name.replace(/[·「」『』\s]/g,'').split(''))];
    const roster=D.civilization.items.filter(x=>x.dim==='P');
    const bios=D.civilization.biographies||[];
    const same=[];
    roster.forEach(x=>{
      const t=String(x.title||'').replace(/（[^）]*）/g,'');
      const hit=chars.filter(c=>c&&t.indexOf(c)>=0);
      if(hit.length)same.push({title:x.title,why:'姓名用字含「'+hit.join('、')+'」',
        rawYear:x.rawYear,summary:x.summary});
    });
    bios.forEach(x=>{
      const hit=chars.filter(c=>c&&String(x.name||'').indexOf(c)>=0);
      if(hit.length&&!same.some(s=>s.title.indexOf(x.name)>=0))
        same.push({title:x.name,why:'姓名用字含「'+hit.join('、')+'」',
          rawYear:x.born||'',summary:x.work||''});
    });
    return {
      isHistorical:false,
      verdict:'不是历史名人 · 本局推演族人',
      sameName:same.slice(0,6),
      disclaimer:'同名只是用字巧合；本局族人不等于册中任何历史人物，'
        +'不表示该人物生平、不与任何真实家族攀附血缘，也不作血缘推断。'
    };

  /* ---------- 史册对照：本局真正遇见的史实人物 ---------- */
  function realRoster(S){
    const seen=S.seenCiv||{},bios=D.civilization.biographies||[];
    const out=D.civilization.items.filter(x=>x.dim==='P'&&seen[x.id]).map(x=>{
      const bare=String(x.title).replace(/（[^）]*）/g,'');
      /* 双向包含：兼容「伊本·西那（阿维森纳）」一类带异译的姓名 */
      const b=bios.find(z=>z.name===x.title
        ||z.name===bare
        ||bare.indexOf(z.name)>=0
        ||String(z.name).indexOf(bare)>=0
        ||String(x.title).indexOf(z.name)>=0);
      return {
        id:x.id,name:x.title,rawYear:x.rawYear,summary:x.summary,
        bio:b?{born:b.born,active:b.active,work:b.work,legacy:b.legacy}:null,
        sources:x.sources||[]

    });
    return out;
  }

  /* ---------- 汇总（收卷报告用） ---------- */
  function summary(S){
    const fam=S.fam||[],alive=fam.filter(p=>p.alive);
    const skills=new Set();fam.forEach(p=>(p.skills||[]).forEach(j=>skills.add(j)));
    const gens=new Set(fam.map(p=>p.gen||1));
    /* 世代以游戏在册的 S.gen 为准：fam 会因长局裁剪只剩最新一两代，
       直接数 fam 里的 gen 会显示「1 代」，与顶栏第 N 代对不上。 */
    return {alive:alive.length,total:fam.length,
      generations:Math.max(1,...gens),span:gens.size,
      dead:S.dead||0,
      skills:skills.size,skillLog:(S.skillLog||[]).length,
      realPeople:realRoster(S).length,
      withParent:fam.filter(p=>p.parent).length};
  }

  W.people={h32:h32,u:u,recordSkill:recordSkill,skillsOf:skillsOf,
    lineageOf:lineageOf,bioOf:bioOf,historyCheck:historyCheck,
    realRoster:realRoster,summary:summary,placeName:placeName};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.people;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));

/* weave.js —— 分卷、终章、里程碑、收卷报告
   借鉴 ink 的 weave：分支(stitch)各自走，到卷末必汇于一处(gather)，
   汇流结果写回下一卷起点。这样「无限分支」有节奏，也真的会收束。 */
(function(W){
  'use strict';
  const D=W.data, V=D.vol, KN={
    people:'人丁',food:'仓廪',craft:'百工',lore:'文脉',
    might:'兵势',cohesion:'族和',faith:'祭祀',wealth:'货殖'
  };
  function volTitle(n){return V.titles[Math.min(n-1,V.titles.length-1)]||('第'+n+'卷');}
  function newVolume(S,n){
    S.vol={n:n,startYear:S.year,startSt:Object.assign({},S.st),
      startTags:Object.assign({},S.tags),startLog:S.log.length,
      startMil:S.mil.length,startDead:S.dead,startGen:S.gen};
    S.volTurn=0;S.stitches=[];
  }
  function stitch(S,o,ev){
    S.stitches=S.stitches||[];
    S.stitches.push({t:o.t,e:o.e||{},tag:(o.e||{}).tag||null,
      chain:(o.e||{}).chain||null,hist:!!ev.isHist,title:ev.t});
  }
  /* 卷末 gather：把散开的分支收成一句回响 + 一处写回 */
  function gather(S){
    const st=S.stitches||[],sum={};
    D.keyOrder.forEach(k=>sum[k]=0);
    let chains=0,hist=0;
    st.forEach(x=>{
      D.keyOrder.forEach(k=>{if(x.e[k])sum[k]+=x.e[k];});
      if(x.chain)chains++;if(x.hist)hist++;
    });
    const top=D.keyOrder.slice().sort((a,b)=>sum[b]-sum[a])[0];
    const gain=sum[top]>0?3:0;
    const title=volTitle(S.vol?S.vol.n:1);
    let echo;
    if(hist>=4)echo='这一卷岔路虽多，末了都汇进史海里——'+hist+' 桩可考之事，把这一族人钉在了大年月上。';
    else if(chains>=3)echo='选下去的每一步都又牵出新的一步，像渠分了又合；到卷末，水仍归同一条。';
    else if(gain)echo='十几笔各奔东西，算下来，最后都落在'+KN[top]+'上。它带着这一卷的分量，进到下一卷。';
    else echo='这一卷没往哪一处偏。岔开，又平平地合回来，也算是种走法。';
    /* 选项留下的行当与回响，也在卷末汇进来，让抉择不只是八维数字 */
    const echoes=(S.optEcho||[]).slice(-3);
    if(echoes.length)echo+='　'+echoes.map(x=>x.t).join('');
    /* 考据立场的口径也汇进来：这一族对断代争议是「存异」还是「从通说」 */
    const stLine=W.consequences?W.consequences.stanceLine(S):'';
    if(stLine)echo+='　'+stLine;
    /* 本卷判读与族账也汇进来：抉择不只落在八维上，还留下读法倾向与未了的旧账 */
    const v=S.vol||{};
    const rl=(S.readingLog||[]).filter(x=>x.y>=(v.startYear||S.year));
    if(rl.length){
      const ok=rl.filter(x=>x.choice==='ok').length,
            bad=rl.filter(x=>x.choice==='bad').length,mid=rl.length-ok-bad;
      echo+='　这一卷辨了 '+rl.length+' 处读法（稳妥 '+ok+'／折中 '+mid+'／误取 '+bad+'）；'
        +(ok>=bad?'争不清楚的那几页，族里多半把异说一并存下。'
                 :'误取的那几笔，往后还得回头擦。');
    }
    const debts=(S.famDebts||[]).filter(d=>!d.cleared);
    if(debts.length)echo+='　族谱上还挂着 '+debts.length+' 笔旧账，得等下一代人来收拾。';
    if(S.clearedDebts)echo+='　已有 '+S.clearedDebts+' 笔旧账了结。';
    if(gain){S.st[top]=Math.min(100,S.st[top]+gain);}
    const logs=S.log.slice(v.startLog||0),mil=S.mil.slice(v.startMil||0);
    const diff={};D.keyOrder.forEach(k=>diff[k]=S.st[k]-(v.startSt? v.startSt[k]||0:0));
    return {n:v.n||1,title:title,from:v.startYear||S.year,to:S.year,
      picks:logs.filter(l=>l.k==='choice').length,
      hist:mil.filter(m=>m.t.indexOf('亲历 · ')===0).map(m=>m.t.slice(5)),
      fam:logs.filter(l=>l.k==='fam').map(l=>l.t),
      mil:mil.map(m=>m.t),
      newTags:Object.keys(S.tags).filter(t=>!(v.startTags||{})[t]),
      dead:S.dead-(v.startDead||0),gen:S.gen-(v.startGen||1),
      diff:diff,echo:echo,top:top,gain:gain,chains:chains,histCount:hist,
      optEcho:echoes,jobs:Object.keys(S.jobs||{}),
      roads:(W.consequences?W.consequences.volumeRoads(S,S.vol?S.vol.n:1,3):[]),
      projects:(S.projects?Object.values(S.projects).filter(p=>p.stage<p.total).map(p=>({
        name:(W.consequences.data.projects.find(x=>x.id===p.pid)||{}).name||p.pid,
        stage:p.stage,total:p.total,title:p.title,from:p.started})) :[]),
      completed:(S.completedProjects||[]).slice(-2)};
  }
  function metricValue(S,m){
    if(m==='tags')return Object.keys(S.tags).length;
    if(m==='gen')return S.gen;
    if(m==='year')return S.year;
    if(m==='score')return S.score;
    if(m==='people')return S.st.people;   // 八维「人丁」，非在籍人数，否则开局三人即触发
    return 0;
  }
  function checkEnding(S){
    if(S.ended)return null;
    for(const e of D.endings){
      const v=metricValue(S,e.metric);
      const goal=e.metric==='people'&&W.difficulty?W.difficulty.peopleFloor(S):e.goal;
      if(e.metric==='people'?v<=goal:v>=goal)return e;
    }
    return null;
  }
  function endProgress(S){
    const a=D.endings.map(e=>{
      const goal=e.goal;
      let p;
      if(e.metric==='people')p=Math.min(.99,(35-S.st.people)/30);
      else if(e.metric==='year')p=(S.year+5000)/(goal+5000);
      else p=metricValue(S,e.metric)/goal;
      return [e.name.replace('之终',''),Math.max(0,p)];
    });
    a.sort((x,y)=>y[1]-x[1]);
    return a[0][0]+'之终 '+Math.min(99,Math.round(a[0][1]*100))+'%';
  }
  function nextNode(S){
    if(S.mode==='succession'&&S.chainState){
      const c=D.succession.chains[S.chainState.region];
      if(!c)return '朝代长河';
      const l=c.entities[S.chainState.idx];
      const left=Math.max(0,D.succession.STEPS_PER_ENTITY-S.chainState.entityTurn);
      if(S.entity&&S.entity.endedShown)return '长河终章已至 · 可收卷';
      return l.name+' 还剩 '+left+' 笔 · 第 '+(S.chainState.idx+1)+'/'+c.entities.length+' 朝';
    }
    if(S.mode==='real'&&S.entity){
      const e=D.entities.entities.find(x=>x.id===S.entity.id);
      if(!e)return '真实血脉';
      if(S.entity.endedShown)return '真实终章已至 · 可收卷或续为遗民';
      const i=Math.max(0,Math.min(5,S.entity.phaseIdx));
      const nx=e.phases[Math.min(5,i+1)];
      return '下一阶段：'+nx.phase+'（'+nx.label+'） · 卷末还差 '+Math.max(0,V.len-S.volTurn)+' 笔';
    }
    if(S.ended)return '终章已至 · 此后为余编';
    return '卷末汇流（还差 '+Math.max(0,V.len-S.volTurn)+' 笔） · '+endProgress(S);
  }
  function verdict(S){
    const order=D.keyOrder.slice();
    const top=order.sort((a,b)=>S.st[b]-S.st[a]).slice(0,2);
    const low=order.slice().sort((a,b)=>S.st[a]-S.st[b])[0];
    return '这一局偏在'+KN[top[0]]+'与'+KN[top[1]]+'，'+KN[low]+'始终薄些。'
      +'史海可考者 '+Object.keys(S.used).length+' 桩，旧例 '+Object.keys(S.tags).length+' 则，'
      +'在籍 '+S.fam.filter(p=>p.alive).length+' 人，凋零 '+S.dead+' 人。';
  }
  function scrollData(S,final){
    return {final:final,from:-5000,to:S.year,turn:S.turn,
      vol:S.vol?S.vol.n:1,gen:S.gen,score:Math.round(S.score),
      st:Object.assign({},S.st),verdict:verdict(S),
      hist:D.events.filter(x=>S.used[x.id]),
      alive:S.fam.filter(p=>p.alive).sort((a,b)=>b.gen-a.gen||b.age-a.age),
      rulers:S.fam.filter(p=>p.role==='ruler'),
      tags:Object.keys(S.tags),tagCounts:Object.assign({},S.tags),
      mil:S.mil.slice(),dead:S.dead,ending:S.ending||null,
      realEnd:S.realEnd||null,
      chain:(S.mode==='succession'&&S.chainState)?(function(){
        const c=D.succession.chains[S.chainState.region];
        return c?{title:c.title,region:c.region,classification:c.classification,
          from:c.from,to:c.to,
          entities:c.entities.map((e,i)=>({name:e.name,from:e.startYear,to:e.endYear,
            transition:e.transition,visited:i<=S.chainState.idx,
            gap:e.gapToNext?{name:e.gapToNext.name,years:e.gapToNext.years}:null}))}:null;
      })():null,
      civ:(function(){
        if(!D.civilization)return null;
        const seen=D.civilization.items.filter(x=>S.seenCiv&&S.seenCiv[x.id]);
        return {total:D.civilization.items.length,
          seen:seen,
          byDim:D.civilization.dimensions.map(d=>({name:d.name,
            got:seen.filter(x=>x.dim===d.key).length,
            total:D.civilization.items.filter(x=>x.dim===d.key).length}))};
      })(),
      entity:((S.mode==='real'||S.mode==='succession')&&S.entity)?(function(){
        const e=D.entities.entities.find(x=>x.id===S.entity.id);
        return e?{name:e.name,phases:e.phases,
          endReason:e.phases[5].note,
          dispute:D.entities.disputes[e.name]||null}:null;
      })():null,
      volLog:S.volLog||[]};
  }
  W.weave={volTitle:volTitle,newVolume:newVolume,stitch:stitch,gather:gather,
    checkEnding:checkEnding,endProgress:endProgress,nextNode:nextNode,
    verdict:verdict,scrollData:scrollData,keyNames:KN};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.weave;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));

/* real.js —— 真实血脉代入：考据史事池 + 十二实体六阶段
   数据来源：data/history.json（72 条考据史事 + 3 条传说层）
             data/entities.json（12 个实体的「建立→扩张→鼎盛→转折→衰落→终结」）
   纪律：史实节点与出处原样呈现；玩家抉择是推演，明确标注，不改写史实。 */
(function(W){
  'use strict';
  const D=W.data;
  const PHASE_STEPS=6;                 // 每阶段 6 笔
  const TOTAL_STEPS=PHASE_STEPS*6;     // 一局 36 笔走完六阶段
  const PHASE_EFFECTS={
    '建立':{people:8,cohesion:10,food:5},
    '扩张':{might:10,wealth:8,food:5,people:4},
    '鼎盛':{lore:10,craft:9,wealth:8,cohesion:6},
    '分立或转折':{cohesion:-12,might:-6,people:-4},
    '衰落':{food:-8,wealth:-8,might:-8,cohesion:-8,people:-6},
    '终结':{cohesion:-10,people:-6}
  };
  const PRECISION_LABEL={exact:'有明确纪年',range:'年代区间',approximate:'约略年代',legendary:'传说或后世追述'};
  const CONSENSUS_LABEL={settled:'学界通说',date_contested:'断代有争议',
    legendary_retroactive:'传说／后世追述',entity_definition_contested:'实体范围有争议'};

  const entityById=id=>D.entities.entities.find(e=>e.id===id)||null;
  const byName=n=>D.entities.entities.find(e=>e.name===n)||null;

  /* 年份按阶段锚点分段线性插值：短命王朝（秦 14 年）也能完整走完六阶段 */
  function yearAt(ent,turn){
    const idx=Math.min(5,Math.floor(turn/PHASE_STEPS));
    const local=turn-idx*PHASE_STEPS;
    const from=ent.phases[idx].year;
    const to=idx<5?ent.phases[idx+1].year:ent.phases[5].year;
    return Math.round(from+(to-from)*local/PHASE_STEPS);
  }
  function phaseIdxAt(turn){return Math.min(5,Math.floor(turn/PHASE_STEPS));}
  function progress(S){
    if(!S.entity)return '';
    const e=entityById(S.entity.id),i=Math.max(0,Math.min(5,S.entity.phaseIdx));
    const p=e.phases[i];
    return e.name+' · '+p.phase+'（'+p.label+'） · 第 '+(i+1)+'/6 阶段';
  }
  function phaseEvent(S){
    const e=entityById(S.entity.id),i=Math.min(5,S.entity.phaseIdx),p=e.phases[i];
    const eff=PHASE_EFFECTS[p.phase]||{};
    const plabel=PRECISION_LABEL[p.precision]||'约略年代';
    const note='史实节点：'+p.event+'（'+p.label+'，'+plabel+'）。'
      +'阶段态势与以下抉择为游戏推演，不改变史实；终结原因见收卷报告。';
    return {
      t:'〔'+p.phase+'〕'+e.name,
      x:p.event+'。'+p.note,
      note:note,
      src:'真实血脉 · '+p.phase,
      isHist:false,isPhase:true,phase:p.phase,phaseLabel:p.label,
      entityName:e.name,precision:p.precision,
      o:[
        ['顺其势，记入编年',{cohesion:3,lore:4}],
        ['力图挽回，另作布置',{might:4,wealth:3,cohesion:-3}]
      ]
    };
  }
  /* 真实史事：72 条按年份窗口进入；本圈=本土，其余=远闻 */
  function historyCandidates(S){
    const y=S.year,reg=S.reg;
    return D.history.events.filter(h=>!S.usedReal[h.id]&&y>=h.y0&&y<=h.y1)
      .map(h=>Object.assign({},h,{near:h.region===reg}));
  }
  function wrapHistory(h){
    const srcText=h.cite||'见考据报告引用来源';
    const links=h.sources.length?'　出处：'+h.sources.map(s=>s.url).join('；'):'';
    return {
      t:h.title,
      x:h.summary,
      note:'【'+h.status+' · '+PRECISION_LABEL[h.precision]+'】'+srcText+links
        +'。以下抉择为游戏推演，非史实记载。',
      src:(h.near?'史实 · ':'远闻 · ')+h.circle,
      isHist:true,realMeta:{id:h.id,status:h.status,consensus:h.consensus,
        precision:h.precision,circle:h.circle,y0:h.y0,y1:h.y1,
        cite:h.cite,sources:h.sources},
      o:[
        ['录其事，存其异说',{lore:6,wealth:2}],
        ['以事为鉴，不改旧例',{cohesion:5,food:2}]
      ]
    };
  }
  function endingCard(S){
    const e=entityById(S.entity.id),p=e.phases[5];
    const ALIAS={'罗马共和国→罗马王朝':'西罗马'};
    const d=D.entities.disputes[e.name]||D.entities.disputes[ALIAS[e.name]]||null;
    return {name:e.name,year:p.label,phaseEvent:p.event,reason:p.note,
      dispute:d?d.alternatives:null,disputeReason:d?d.reason:null,
      word:'编年走到 '+p.label+'，'+e.name+'作为自立政治实体的历史到此为止。'
        +'这不是游戏随机判定的终点，是史料里写着的年份。'};
  }
  W.real={PHASE_STEPS:PHASE_STEPS,TOTAL_STEPS:TOTAL_STEPS,
    PHASE_EFFECTS:PHASE_EFFECTS,PRECISION_LABEL:PRECISION_LABEL,CONSENSUS_LABEL:CONSENSUS_LABEL,
    entityById:entityById,byName:byName,yearAt:yearAt,phaseIdxAt:phaseIdxAt,
    progress:progress,phaseEvent:phaseEvent,historyCandidates:historyCandidates,
    wrapHistory:wrapHistory,endingCard:endingCard};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.real;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));

(function(W){

  const C=D.civilization;
  const PRECISION_LABEL={exact:'有明确纪年',range:'年代区间',approximate:'约略年代',legendary:'传说或后世追述'};
  const CONSENSUS_LABEL={settled:'学界通说',date_contested:'断代有争议',legendary_retroactive:'传说／后世追述'};
  const RANK_LABEL={'机构／学术':'机构／学术','百科／媒体':'百科／媒体','其他':'其他',undefined:'出处'};

  const byId={};C.items.forEach(x=>byId[x.id]=x);
  const dimByKey={};C.dimensions.forEach(d=>dimByKey[d.key]=d);
  const unlockBy={};C.unlocks.forEach(u=>unlockBy[u.id]=u);
  const treasureBy={};C.treasures.forEach(t=>treasureBy[t.id]=t);
  /* 人物生平：按姓名宽松匹配到条目 id */
  const bioByItem={};
  C.biographies.forEach(b=>{
    const hit=C.items.find(x=>x.title.indexOf(b.name)>=0)||C.items.find(x=>b.name.indexOf(x.title)>=0);
    bioByItem[hit?hit.id:b.id]=b;
  });

  function hostOf(u){
    try{return String(u).replace(/^https?:\/\//,'').split('/')[0].replace(/^www\./,'');}
    catch(e){return '出处见文明页';}
  }
  function itemById(id){return byId[id]||null;}
  function dimensionOf(key){return dimByKey[key]||null;}

  /* 八维写回：维度主属性 + 门类微调 */
  function effect(item){
    const e={},c=item.category||'',d=dimByKey[item.dim];
    const add=(k,v)=>{e[k]=(e[k]||0)+v;};
    add(d?d.stat:'lore',5);
    if(/农业|水利|农具|耕作|灌溉|作物|驯化|食物|酿造/.test(c))add('food',4);
    else if(/冶金|机械|动力|交通|航海|造船|建筑|材料|合金|釉|火药|飞行|航空/.test(c)){add('craft',2);add('wealth',2);}
    else if(/天文|历法|医学|数学|记数|几何|代数|测算|断代|测年/.test(c))add('lore',3);
    else if(/宗教|信仰|祭祀|神话|创世|经典/.test(c))add('faith',3);
    else if(/货币|账簿|契约|经营|字号|市集|拍卖|典当|广告|贸易|商路/.test(c)){add('wealth',3);add('craft',1);}
    else if(/兵|军|阵|城防|甲|弩|火器|水师/.test(c))add('might',4);
    else if(/乐|律|音|谱|画|塑|书|陶|瓷|玉|石刻|写本|鉴|藏/.test(c))add('cohesion',3);
    else if(/法|律令|刑|判|条约|宪/.test(c)){add('cohesion',3);add('lore',1);}
    else add('cohesion',2);
    return e;
  }

  /* 解锁：前置条目必须已见过（引用不存在的前置视为满足，避免卡死） */
  function unlocked(x,seen,year){
    const u=unlockBy[x.id];
    if(!u||!u.requires.length)return true;
    return u.requires.every(r=>{
      const p=byId[r];
      if(!p)return true;                       // 引用不存在，不卡死
      if(p.y1>x.y0)return true;                // 数据里前置晚于目标，视为无效依赖
      return !!seen[r]||year>=p.y1;            // 已见过，或前置年代已过
    });
  }
  function unlockInfo(x){
    const u=unlockBy[x.id];
    return u&&u.requires.length?{requires:u.requires,note:u.note}:null;
  }
  function candidates(S){
    const y=S.year,seen=S.seenCiv||{},t=W.reality.tier(S.reality);
    const m=W.reality.mode(S.modeKey),dens=W.reality.density(S.density).w;
    return C.items.filter(x=>!seen[x.id]&&!x.displayOnly&&y>=x.y0&&y<=x.y1
        &&unlocked(x,seen,y)&&W.reality.allows(t,x.layer||'fact',x))
      .map(x=>({item:x,near:x.region===S.reg,
        weight:(x.region===S.reg?3:1)*(x.precision==='legendary'?.35:1)*dens
          *(m.collectBoost?1.5:1)*(x.ancient?.6:1)}));
  }
  function pick(S,rnd){
    const cs=candidates(S);
    if(!cs.length)return null;
    let total=cs.reduce((a,b)=>a+b.weight,0),r=rnd()*total,ch=cs[cs.length-1];
    for(const c of cs){r-=c.weight;if(r<=0){ch=c;break;}}
    return ch;
  }
  /* 传说层玩法：给出「辨其传说」的第三选项，选对才算读懂史料 */
  function quiz(item){
    if(item.precision!=='legendary'&&item.consensus!=='legendary_retroactive')return null;
    return {q:'这一条应归为哪一类？',
      a:'传说或后世追述',
      wrong:['有明确纪年的确证史实','断代有争议但可考'],
      reward:{lore:5,cohesion:2}};
  }
  function wrap(ch){
    const x=ch.item;
    const hosts=[...new Set(x.sources.map(s=>hostOf(s.url)))];
    const ranks=[...new Set(x.sources.map(s=>RANK_LABEL[s.rank]||'出处'))];
    const dim=dimByKey[x.dim];
    let note='【'+x.status+' · '+PRECISION_LABEL[x.precision]+'】'
      +x.dimName+'／'+x.category+' · '+x.rawYear+'。'
      +'出处：'+(hosts.slice(0,2).join('、')||'见文明页')
      +(x.sources.length>2?' 等 '+x.sources.length+' 条':'')
      +'（'+ranks.join('／')+'；完整引文见文明页）。';
    if(x.boundary)note+=' '+x.boundary;
    const u=unlockInfo(x);
    if(u)note+=' 前置：'+u.requires.map(r=>byId[r]?byId[r].title:r).join('、')+'。'+u.note;
    note+=' 以下抉择为游戏推演，不改变史实。';
    const o=[
      ['取其法，录于册',effect(x)],
      ['只记其事，不轻改旧例',{lore:3,cohesion:2}]
    ];
    const q=quiz(x);
    if(q){
      o.push(['辨其传说：'+q.q+' → '+q.a,Object.assign({},q.reward,{_quiz:true,_correct:true})]);
      o.push(['断为确证史实',{lore:-2,_quiz:true,_correct:false}]);
    }
    const bio=bioByItem[x.id],tre=treasureBy[x.id];
    return {
      t:x.title,x:x.summary,note:note,
      src:(ch.near?'史实 · ':'远闻 · ')+(dim?dim.badge:x.dimName)+'／'+x.category,
      isHist:true,isCiv:true,civMeta:x,
      quiz:q,bio:bio||null,treasure:tre||null,
      o:o.slice(0,4)
    };
  }
  function progress(S){
    const seen=S.seenCiv||{};
    return C.dimensions.map(d=>{
      const total=C.items.filter(x=>x.dim===d.key).length;
      const got=C.items.filter(x=>x.dim===d.key&&seen[x.id]).length;
      return {key:d.key,name:d.name,badge:d.badge,desc:d.desc,seen:got,total:total,
        rate:total?Math.round(got/total*100):0};
    });
  }
  function seenItems(S,dimKey){
    const seen=S.seenCiv||{};
    return C.items.filter(x=>seen[x.id]&&(!dimKey||x.dim===dimKey));
  }
  function lens(S){
    const p=S.personLens?itemById(S.personLens):null;
    if(!p)return null;
    const b=bioByItem[p.id];
    return '此时，'+p.title+'（'+p.category+'，'+(b?b.active:p.rawYear)+'）正在这一段的年月里。'
      +(b?'身后：'+b.legacy.slice(0,26)+'……':'')+' 旧例里也留着你们自己走过的人。';
  }
  function sourcesOf(x){return x.sources||[];}
  W.civilization={PRECISION_LABEL:PRECISION_LABEL,CONSENSUS_LABEL:CONSENSUS_LABEL,
    RANK_LABEL:RANK_LABEL,itemById:itemById,dimensionOf:dimensionOf,
    effect:effect,unlocked:unlocked,unlockInfo:unlockInfo,
    candidates:candidates,pick:pick,wrap:wrap,quiz:quiz,
    progress:progress,seenItems:seenItems,lens:lens,hostOf:hostOf,
    sourcesOf:sourcesOf,byId:byId,dimByKey:dimByKey,treasureBy:treasureBy,bioByItem:bioByItem};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.civilization;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));


/* ===== src/succession.js ===== */
/* succession.js —— 朝代更迭长河与「真实人物同期政权」
   数据来源：data/succession.json（由 tools/build_succession.js 从实体年表生成）
   纪律：只有纪年首尾不重叠的政权才排成线性更迭链；重叠者列为并存政权群，
        不硬串成一条王朝线。人物与政权只表示年代窗口重叠，不表示隶属或仕宦。 */
(function(W){
  'use strict';
  const D=W.data;
  const STEPS_PER_ENTITY=12;   // 每朝 12 笔 = 一卷：6 阶段各 1 笔节点 + 1 笔文明/史事
  const available=()=>Object.keys(D.succession.chains);
  const chainOf=r=>D.succession.chains[r]||null;
  const coexisting=()=>D.succession.coexisting||{};

  function link(S){
    const c=chainOf(S.chainState.region);
    return c?c.entities[S.chainState.idx]:null;
  }
  function isLast(S){
    const c=chainOf(S.chainState.region);
    return S.chainState.idx>=c.entities.length-1;
  }
  function progress(S){
    const c=chainOf(S.chainState.region),l=link(S);
    if(!c||!l)return '';
    const stage=Math.max(1,Math.min(6,Math.ceil(S.chainState.entityTurn/2)));
    return l.name+' · 第 '+(S.chainState.idx+1)+'/'+c.entities.length+' 朝 · 阶段 '+stage+'/6';
  }
  /* 每朝 12 笔：奇数笔=阶段节点年，偶数笔=区间内插值年，保证单调不倒退 */
  function yearAt(S){
    const l=link(S),t=S.chainState.entityTurn;
    if(!l)return S.year;
    const stage=Math.min(5,Math.floor((t-1)/2));
    const p=l.phases[stage],nx=l.phases[Math.min(5,stage+1)];
    if((t-1)%2===0)return p.year;
    let y=(p.y1&&p.y1>p.year)?p.y1:p.year+1;
    if(nx&&nx.year>p.year)y=Math.min(y,nx.year-1);
    return Math.max(p.year,y);
  }
  function phaseIdx(S){
    return Math.min(5,Math.floor((S.chainState.entityTurn-1)/2));
  }
  function nodeTurn(S){return (S.chainState.entityTurn-1)%2===0;}

  /* 同期政权：当前朝 + 该条目的年代重叠政权（人物不标隶属） */
  function contemporaries(S,cur){
    const out=[],c=chainOf(S.chainState.region);
    if(c){
      const l=link(S);
      if(l)out.push({name:l.name,note:'当前政权纪年'});
    }
    if(cur&&cur.isCiv&&cur.civMeta){
      const hits=D.succession.itemLinks[cur.civMeta.id]||[];
      hits.forEach(h=>{
        if(!out.some(o=>o.id===h.id))out.push({id:h.id,name:h.name,note:'年代窗口重叠'});
      });
    }
    return out;
  }
  function entityItems(entityId){
    const ids=D.succession.entityLinks[entityId]||[];
    return D.civilization.items.filter(x=>ids.indexOf(x.id)>=0);
  }
  function seenInEntity(S){
    const l=link(S);if(!l)return [];
    const ids=D.succession.entityLinks[l.id]||[];
    return D.civilization.items.filter(x=>ids.indexOf(x.id)>=0&&S.seenCiv&&S.seenCiv[x.id]);
  }
  /* 更迭卡：终结 → 间朝 → 下一朝 */
  function turnoverCard(S){
    const c=chainOf(S.chainState.region),l=link(S),last=isLast(S),next=last?null:c.entities[S.chainState.idx+1];
    const seen=seenInEntity(S);
    const byDim={};
    seen.forEach(x=>byDim[x.dimName]=(byDim[x.dimName]||0)+1);
    const people=seen.filter(x=>x.dim==='P').map(x=>x.title);
    const dispute=D.entities.disputes[l.name]||null;
    return {
      region:c.region,chainTitle:c.title,
      idx:S.chainState.idx+1,total:c.entities.length,
      name:l.name,from:l.startYear,to:l.endYear,
      endReason:l.endReason,transition:l.transition,
      gap:l.gapToNext,next:next?{name:next.name,startYear:next.startYear,
        event:next.phases[0].event,label:next.phases[0].label}:null,
      dispute:dispute?dispute.alternatives:null,
      seenCount:seen.length,byDim:byDim,people:people,
      tail:last?c.tail:null,
      classification:c.classification,last:last
    };
  }
  function chainSummary(S){
    const c=chainOf(S.chainState.region);
    if(!c)return null;
    return c.entities.map((e,i)=>({name:e.name,from:e.startYear,to:e.endYear,
      visited:i<S.chainState.idx+(S.chainState.entityTurn>0?1:0),
      current:i===S.chainState.idx,transition:e.transition}));
  }
  W.succession={STEPS_PER_ENTITY:STEPS_PER_ENTITY,
    available:available,chainOf:chainOf,coexisting:coexisting,
    link:link,isLast:isLast,progress:progress,yearAt:yearAt,
    phaseIdx:phaseIdx,nodeTurn:nodeTurn,
    contemporaries:contemporaries,entityItems:entityItems,
    seenInEntity:seenInEntity,turnoverCard:turnoverCard,chainSummary:chainSummary};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.succession;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));


/* ===== src/reality.js ===== */
/* reality.js —— 真实性档位、玩法模式、时长与分层纪律
   核心原则：史实不可改；趣味来自抉择后果、收集、判读、家族命运与对照局，
            不来自把野史／假说伪装成历史。 */
(function(W){
  'use strict';
  const D=W.data;

  const LAYERS={
    fact:{name:'史实',color:'gold',desc:'有出处支撑的可考条目'},
    text:{name:'文本传统',color:'blue',desc:'野史、笔记、演义、小说：文本真实存在，但内容不等于史实'},
    hypothesis:{name:'未证实假说',color:'red',desc:'无考古／文献／可重复证据支持；纯虚构推演素材'},
    prehistory:{name:'史前可考',color:'green',desc:'有考古证据的史前人类活动'},
    fiction:{name:'虚构推演',color:'dim',desc:'程序化生成的游戏情境'}
  };

  const TIERS=[
    {key:'strict',name:'考据档',short:'考据',
      desc:'只进学界通说、有明确纪年或区间的史实；断代争议与传说层不进事件池。气候现象照常抵达，但不作社会归因。',
      allow:{fact:'settled',text:false,hypothesis:false},
      note:'最贴近「尽可能还原」。你会错过不少有意思的传说，但不会读到假的东西。'},
    {key:'balanced',name:'兼容档',short:'兼容',
      desc:'史实全开（争议与传说单独标注），野史小说以「文学文本·非史实」入池；未证实假说仍关闭。',
      allow:{fact:'all',text:true,hypothesis:false},
      note:'默认档。传说可「辨其传说」，小说可读不可信，史实仍不改写。'},
    {key:'wild',name:'狂想档',short:'狂想',
      desc:'额外开放史前超文明、古代宇航员等未证实假说，全部以红色醒目标「无证据·虚构推演」。',
      allow:{fact:'all',text:true,hypothesis:true},
      note:'明确是玩，不是学史。每张假说卡都写清学界地位与证据状况。'}
  ];
  const MODES=[
    {key:'chronicle',name:'编年',desc:'标准推进：史实与推演交织，卷末汇流，终章收卷',
      hist:1,clim:1,text:1,pressure:1,score:1},
    {key:'quiz',name:'考据',desc:'史实与文本传统密度翻倍，考据判读计分翻倍，专练辨伪与断代',
      hist:1.7,clim:.7,text:1.6,pressure:.7,score:1.8,quizBoost:true},
    {key:'collect',name:'鉴宝',desc:'文明条目与鉴宝卡高频出现，以收集完成度为主轴',
      hist:.8,clim:.6,text:1.2,pressure:.7,score:1.2,collectBoost:true},
    {key:'survive',name:'存续',desc:'地理气候压力翻倍，仓廪与族和衰减加快，家族求生',
      hist:.9,clim:2.1,text:.5,pressure:1.9,score:1.3,survive:true},
    {key:'sandbox',name:'沙盒',desc:'史实节点锁定不可改写，自由推演家族与分支，弱化终章',
      hist:1.2,clim:.8,text:1,pressure:.6,score:1,sandbox:true}
  ];
  const LENGTHS=[
    {key:'short',name:'短局',vol:4,maxVol:2,desc:'4 笔一卷，2 卷即收卷，约 8 笔一局'},
    {key:'standard',name:'标准',vol:12,maxVol:0,desc:'12 笔一卷，达成条件出终章'},
    {key:'long',name:'长卷',vol:12,maxVol:0,desc:'12 笔一卷，优先朝代长河连走六朝'},
    {key:'endless',name:'无尽',vol:12,maxVol:0,desc:'12 笔一卷，不触发随机终章，一直点下去'}
  ];
  const DENSITIES=[
    {key:0,name:'清淡',desc:'推演情境为主，史实点缀',w:.45},
    {key:1,name:'均衡',desc:'史实与推演各半',w:1},
    {key:2,name:'密集',desc:'史实为主，密集遇见可考条目',w:1.7},
    {key:3,name:'编年史',desc:'几乎每笔都是可考条目',w:2.6}
  ];
  const tier=k=>TIERS.find(x=>x.key===k)||TIERS[1];
  const mode=k=>MODES.find(x=>x.key===k)||MODES[0];
  const length=k=>LENGTHS.find(x=>x.key===k)||LENGTHS[1];
  const density=k=>DENSITIES[k]||DENSITIES[1];

  /* 档位过滤：一条文明／文本／假说能否进候选池 */
  function allowsFact(t,x){
    if(t.allow.fact==='settled')
      return x.consensus==='settled'&&x.precision!=='legendary'&&!x.ancient;
    return true;
  }
  function allows(t,layer,x){
    if(layer==='fact')return allowsFact(t,x);
    if(layer==='text')return !!t.allow.text;
    if(layer==='hypothesis')return !!t.allow.hypothesis;
    if(layer==='prehistory')return true;      // 序章展示，不进池
    return false;
  }
  function label(layer){return LAYERS[layer]||LAYERS.fiction;}
  /* 每档的醒目横幅文案 */
  function banner(S){
    const t=tier(S.reality),m=mode(S.modeKey),l=length(S.lengthKey);
    return t.name+' · '+m.name+' · '+l.name;
  }
  function disclaimer(S){
    const t=tier(S.reality);
    let s=t.note;
    if(t.key==='wild')s+=' 【本档含明确标注的未证实假说，不是史实】';
    return s;
  }
  W.reality={LAYERS:LAYERS,TIERS:TIERS,MODES:MODES,LENGTHS:LENGTHS,DENSITIES:DENSITIES,
    tier:tier,mode:mode,length:length,density:density,allows:allows,allowsFact:allowsFact,
    label:label,banner:banner,disclaimer:disclaimer};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.reality;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));


/* ===== src/difficulty.js ===== */
/* difficulty.js —— 难度档位（与真实性档位／玩法／时长／密度正交）
   只改「推演层」的数值与指引，不改史实条目、年代、出处、可信度与出现与否。
   难度写进存档与分享串，保证同种子 + 同难度 + 同选择序列可复盘。 */
(function(W){
  'use strict';
  const D=W.data,C=D.difficulty;
  const DIFFS=C.diffs;
  const tier=k=>DIFFS.find(x=>x.key===k)||DIFFS[1];
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const statKeys=()=>D.keyOrder;

  /* 开局初始八维；简单略宽裕、困难略紧，clamp 在 0—100 */
  function applyStart(S,st){
    const d=tier(S.difficulty);
    if(!d.startBonus)return st;
    statKeys().forEach(k=>{st[k]=clamp(st[k]+d.startBonus,0,100);});
    return st;
  }

  /* 统一给一批选项「整形」：收益／代价／风险各按难度缩放。
     放在 generate() 末尾，保证卡面（estat/risk）与结算（apply/applyEff）读的是同一份数据。
     只处理八维数值键；tag / chain / _quiz 等非数值字段原样保留。 */
  function shapeOpts(opts,S){
    const d=tier(S&&S.difficulty);
    if(!opts||!opts.length)return opts;
    const isStat=k=>statKeys().indexOf(k)>=0;
    const scale=(o,pos,neg)=>{
      Object.keys(o||{}).forEach(k=>{
        if(!isStat(k)||typeof o[k]!=='number')return;
        const m=o[k]>=0?pos:neg;
        o[k]=Math.round(o[k]*m);
      });

/* tutorial.js —— 新手教程状态机
   线性八步，跟着玩家动作自动推进；每一步也能手动「下一步」跳过。
   教程只解释玩法与界面，不写进史实编年、不改八维、不消耗主随机源。 */
(function(W){
  'use strict';
  const D=W.data,T=D.tutorial;
  const STEPS=T.steps;

  function fresh(S,on){
    return {
      on:!!on, idx:0, done:false, auto:true,
      tabs:{}, sawScroll:false, acked:{}, skipped:{},
      startedTurn:(S&&S.turn)||0
    };
  }
  /* 旧档迁移：没有 tutorial 字段时，按难度决定是否默认开；
     老局重看教程用纯手动翻页，避免 gate 瞬间全满足。 */
  function ensure(S){
    if(!S)return null;
    if(!S.tutorial||typeof S.tutorial!=='object'){
      const d=W.difficulty?W.difficulty.tier(S.difficulty):null;
      S.tutorial=fresh(S,!!(d&&d.tutorialDefault));
      S.tutorial.auto=false;             // 老档不自动弹教程
    }
    const t=S.tutorial;
    if(typeof t.idx!=='number')t.idx=0;
    if(!t.tabs)t.tabs={};
    if(!t.acked)t.acked={};
    if(!t.skipped)t.skipped={};
    if(typeof t.auto!=='boolean')t.auto=false;
    if(typeof t.sawScroll!=='boolean')t.sawScroll=false;
    if(t.idx>=STEPS.length)t.idx=STEPS.length-1;
    return t;
  }

  /* gate：这一步「做到了」没有。ack / done 永不自动满足，必须点按钮。 */
  function gateOK(step,S){
    const t=ensure(S);
    switch(step.gate){
      case 'ack':   return !!t.acked[step.id];
      /* 用「玩家真的选过几笔」判定，而不是 turn（step 开局就把 turn 推到 1 了） */
      case 'choice1':return (S.choices||[]).length>=1;
      case 'result': return (S.choices||[]).length>=2;
      case 'vol':    return (S.volLog||[]).length>=1;
      case 'tabs':   return !!t.tabs.civ&&!!t.tabs.geo;
      case 'scroll': return !!t.sawScroll;
      case 'done':   return false;
      default:       return false;
    }
  }
  const step=S=>STEPS[ensure(S).idx];
  const progress=S=>({idx:ensure(S).idx+1,total:STEPS.length});

  /* 每帧调用：只在「新手阶段」自动推进，一次最多一步。
     返回是否发生变化，让调用方决定要不要存档。 */
  function advance(S){
    const t=ensure(S);
    if(!t.on||t.done)return false;
    const cur=STEPS[t.idx];
    if(!cur)return false;
    /* 新手阶段按「开教程后走过多少笔」算；重看教程 auto=false，一律手动翻页 */
    const inNewGame=t.auto&&((S.turn||0)-(t.startedTurn||0))<=40;
    if(!inNewGame)return false;
    if(!gateOK(cur,S))return false;
    t.idx++;
    if(t.idx>=STEPS.length-1){
      /* 最后一步要玩家自己点「完成」，不自动收起 */
      t.idx=STEPS.length-1;
    }
    return true;
  }
  /* 手动下一步：跳过当前 gate，教程继续 */
  function next(S){
    const t=ensure(S);
    const cur=STEPS[t.idx];
    if(cur&&!gateOK(cur,S))t.skipped[cur.id]=1;
    if(t.idx<STEPS.length-1){t.idx++;return true;}
    t.done=true;t.on=false;return true;
  }
  function prev(S){
    const t=ensure(S);
    if(t.idx>0){t.idx--;t.done=false;t.on=true;return true;}
    return false;
  }
  function ack(S){
    const t=ensure(S),cur=STEPS[t.idx];
    if(cur)t.acked[cur.id]=1;
    return true;
  }
  function skip(S){
    const t=ensure(S);
    t.on=false;t.done=true;t.idx=STEPS.length-1;
    return true;
  }
  function reopen(S){
    S.tutorial=fresh(S,true);
    S.tutorial.auto=false;              // 重看一律手动翻页
    return S.tutorial;
  }
  function setOn(S,on){
    const t=ensure(S);
    /* 只切显示开关，不动 auto：新局开局时仍需按玩家动作自动推进 */
    if(on){t.on=true;t.done=false;}
    else{t.on=false;t.done=true;}
    return t;
  }
  /* 界面事件：切页签、看过收卷报告 */
  function noteTab(S,tab){
    const t=ensure(S);
    if(tab!=='civ'&&tab!=='geo')return false;
    if(t.tabs[tab])return false;
    t.tabs[tab]=1;return true;
  }
  function noteScroll(S){
    const t=ensure(S);
    if(t.sawScroll)return false;
    t.sawScroll=true;return true;
  }

  W.tutorial={STEPS:STEPS,meta:T.meta,fresh:fresh,ensure:ensure,
    step:step,progress:progress,gateOK:gateOK,advance:advance,
    next:next,prev:prev,ack:ack,skip:skip,reopen:reopen,setOn:setOn,
    noteTab:noteTab,noteScroll:noteScroll};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.tutorial;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));
