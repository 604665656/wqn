    dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
    baseW=cssW;baseH=cssW/2;
    if(view.scale===1&&view.tx===0&&view.ty===0)resetView();
    clampView();draw();
  }
  function resetView(){view.scale=1;view.tx=0;view.ty=(cssH-baseH)/2;}
  function clampView(){
    const mw=baseW*view.scale,mh=baseH*view.scale;
    view.tx=mw<=cssW?(cssW-mw)/2:clamp(view.tx,cssW-mw,0);
    view.ty=mh<=cssH?(cssH-mh)/2:clamp(view.ty,cssH-mh,0);
  }
  function zoomAt(factor,mx,my){
    const old=view.scale,next=clamp(old*factor,1,16),k=next/old;
    if(next===old)return;
    view.scale=next;
    view.tx=mx-(mx-view.tx)*k;
    view.ty=my-(my-view.ty)*k;
    clampView();draw();
  }
  function zoom(f){zoomAt(f,cssW/2,cssH/2);}
  function reset(){resetView();draw();}
  function getView(){return {scale:view.scale,tx:view.tx,ty:view.ty};}
  function getYear(){return year;}
  function getLayers(){return Object.assign({},layers);}
  function setLayers(o){
    Object.keys(layers).forEach(k=>{if(typeof o[k]==='boolean')layers[k]=o[k];});
    draw();emitList(true);
  }
  function setFamily(f){family=f||{dist:[],migrations:[]};draw();}
  function setYear(y,fromGame){
    if(fromGame){
      gameYear=Math.round(y);
      if(userYear!==null)return;
    }else userYear=Math.round(y);
    year=Math.round(y);draw();emitList();
  }
  function followGame(){userYear=null;setYear(gameYear,true);}
  function isManual(){return userYear!==null;}

  /* ---------- 数据筛选 ---------- */
  function activePolities(){return A.polities.filter(p=>year>=p.from&&year<=p.to);}
  function activeRoutes(){return A.routes.filter(r=>year>=r.from&&year<=r.to);}
  function activeClimate(){
    return L.climate.filter(c=>year>=c.y0&&year<=c.y1)
      .sort((a,b)=>(b.rank==='机构／学术'?1:0)-(a.rank==='机构／学术'?1:0)||b.y1-a.y1);
  }
  function eraAt(y){
    const es=L.population.eras;let hit=es[0];
    es.forEach(e=>{if(y>=e.from)hit=e;});
    return hit;
  }
  function popWeight(k,y){
    const es=L.population.eras,e=eraAt(y),i=es.indexOf(e),next=es[Math.min(i+1,es.length-1)];
    let w=e.weights[k.region]||.4;
    if(next!==e&&next.from>e.from){
      const t=clamp((y-e.from)/(next.from-e.from),0,1);
      w=w+((next.weights[k.region]||.4)-w)*t;
    }
    return clamp(w*k.adj,0,1);
  }
  function popTop(n){
    return L.population.kernels.map(k=>({name:k.name,region:k.region,w:popWeight(k,year)}))
      .sort((a,b)=>b.w-a.w).slice(0,n||5);
  }
  function kernelById(id){return L.population.kernels.find(k=>k.id===id);}

  /* ---------- 绘制基础 ---------- */
  function pathOf(ring,close){
    ctx.beginPath();
    ring.forEach((p,i)=>{const x=X(p[0]),y=Y(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    if(close)ctx.closePath();
  }
  function label(t,x,y,color,size,align){
    if(x<-60||x>cssW+60||y<-20||y>cssH+20)return;
    ctx.fillStyle=color||'#e8dcc2';
    ctx.font=(size||11)+'px "WenQuanYi Micro Hei",sans-serif';
    ctx.textAlign=align||'center';ctx.textBaseline='middle';
    ctx.fillText(t,x,y);
  }
  function hexA(hex,a){
    const h=hex.replace('#','');
    const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  function shortName(s){
    return s.replace(/（.*?）/g,'').replace(/→.*$/,'').length>11
      ? s.replace(/（.*?）/g,'').slice(0,10)+'…' : s.replace(/（.*?）/g,'');
  }
  function clipLand(){
    ctx.beginPath();
    A.lands.forEach(L2=>L2.ring.forEach((p,i)=>{
      const x=X(p[0]),y=Y(p[1]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }));
    ctx.clip();
  }

  /* ---------- 人口热力：相对聚集重心，不是人口统计 ---------- */
  function drawPopulation(){
    const R=Math.max(26,baseW*.085)*Math.min(3.2,Math.sqrt(view.scale));
    /* 按文明圈聚合：否则单元多的圈（华夏 6 个、爱琴 5 个）会因光斑叠加显得人口更多。
       这里先画「圈级重心」，单元只作低亮细节，亮度才真正对应时代相对权重。 */
    const groups={};
    L.population.kernels.forEach(k=>{
      if(k.region==='*')return;
      (groups[k.region]=groups[k.region]||[]).push(k);
    });
    ctx.save();clipLand();
    ctx.globalCompositeOperation='lighter';
    Object.keys(groups).forEach(reg=>{
      const ks=groups[reg];
      const cx=ks.reduce((s,k)=>s+k.lon,0)/ks.length;
      const cy=ks.reduce((s,k)=>s+k.lat,0)/ks.length;
      const w=popWeight(ks[0],year);
      if(w<.12)return;
      /* 半径按该圈单元跨度，避免所有圈画成一样大的圆 */
      const spanLon=Math.max(...ks.map(k=>k.lon))-Math.min(...ks.map(k=>k.lon));
      const rx=Math.max(R*.9,(spanLon/360*baseW*view.scale)/2+R*.5);
      const x=X(cx),y=Y(cy),r=Math.min(rx,R*2.1);
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      if(w<.5)g.addColorStop(0,'rgba(80,140,190,'+(.20+w*.42).toFixed(3)+')');
      else if(w<.78)g.addColorStop(0,'rgba(205,135,60,'+(.22+w*.40).toFixed(3)+')');
      else g.addColorStop(0,'rgba(240,205,95,'+(.24+w*.42).toFixed(3)+')');
      g.addColorStop(.6,'rgba(120,110,70,.08)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    });
    /* 单元级细节：固定低亮，只标「哪些地理单元参与了示意」 */
    L.population.kernels.forEach(k=>{
      const w=popWeight(k,year);if(w<.2)return;
      const x=X(k.lon),y=Y(k.lat),r=R*.32;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(245,215,140,'+(.06+w*.10).toFixed(3)+')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
    /* 高热核标注 */
    if(view.scale>=2.2){
      popTop(4).forEach(p=>{
        const k=L.population.kernels.find(q=>q.name===p.name);if(!k)return;
        label(p.name,X(k.lon),Y(k.lat)-9,'rgba(245,220,150,.8)',9);
      });
    }
  }

  /* ---------- 气候影响区：示意椭圆，不是实测范围 ---------- */
  function drawClimate(){
    const cs=activeClimate(),regional=cs.filter(c=>c.box).slice(0,8);
    ctx.save();clipLand();
    regional.forEach(c=>{
      const b=c.box,x=X(b.cx),y=Y(b.cy);
      const rx=Math.max(8,b.rx/360*baseW*view.scale),ry=Math.max(6,b.ry/180*baseH*view.scale);
      ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
      ctx.fillStyle=hexA(c.color,.14);ctx.fill();
      ctx.setLineDash([3,4]);ctx.lineWidth=1.1;ctx.strokeStyle=hexA(c.color,.78);ctx.stroke();
      ctx.setLineDash([]);
      if(view.scale>=3.6)label(shortName(c.title),x,y,hexA(c.color,.95),9);
    });
    ctx.restore();
    /* 全球性事件：不画假范围，只在图边加一条提示 */
    const glob=cs.filter(c=>c.global).length;
    if(glob){
      ctx.fillStyle='rgba(120,175,205,.75)';
      ctx.fillRect(0,0,cssW,3);
      label('全球性气候现象 '+glob+' 条（不画范围）',cssW-12,cssH-30,'rgba(150,195,220,.85)',9,'right');
    }
  }

  /* ---------- 家族分布：本局推演数据 ---------- */
  function drawFamily(){
    const dist=family.dist||[],mig=family.migrations||[];
    /* 迁徙路线 */
    mig.slice(-6).forEach(m=>{
      const a=kernelById(m.from),b=kernelById(m.to);
      if(!a||!b)return;
      const x1=X(a.lon),y1=Y(a.lat),x2=X(b.lon),y2=Y(b.lat);
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.setLineDash([4,4]);ctx.lineWidth=1.2;
      ctx.strokeStyle='rgba(240,190,110,.55)';ctx.stroke();ctx.setLineDash([]);
      const mx=(x1+x2)/2,my=(y1+y2)/2;
      ctx.beginPath();ctx.arc(mx,my,2.4,0,Math.PI*2);ctx.fillStyle='#f0be6e';ctx.fill();
    });
    /* 据点 */
    dist.forEach(d=>{
      const k=kernelById(d.unit);if(!k)return;
      const x=X(k.lon),y=Y(k.lat),r=4+Math.min(9,Math.sqrt(d.count)*2.6);
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,205,110,.30)';ctx.fill();
      ctx.lineWidth=d.ruler?2:1.3;
      ctx.strokeStyle=d.ruler?'#ffe08a':'#e6b45c';ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle='#fff0c4';ctx.fill();
      /* 只给当家所在据点标名，避免东亚一带政权／城址／家族标签叠成一团 */
      if(d.ruler&&view.scale>=1.5)
        label(k.name+' '+d.count+' 人',x,y-r-8,'#ffe0a0',10);
    });
  }

  /* ---------- 主绘制 ---------- */
  function draw(){
    if(!ctx)return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    const g=ctx.createLinearGradient(0,0,0,cssH);
    g.addColorStop(0,'#18242c');g.addColorStop(1,'#10171d');
    ctx.fillStyle=g;ctx.fillRect(0,0,cssW,cssH);
    /* 经纬网 */
    ctx.lineWidth=1;ctx.strokeStyle='rgba(120,155,175,.13)';
    ctx.beginPath();
    for(let lo=-180;lo<=180;lo+=30){const x=X(lo);ctx.moveTo(x,Y(90));ctx.lineTo(x,Y(-90));}
    for(let la=-90;la<=90;la+=30){const y=Y(la);ctx.moveTo(X(-180),y);ctx.lineTo(X(180),y);}
    ctx.stroke();
    ctx.strokeStyle='rgba(160,190,205,.22)';
    ctx.beginPath();ctx.moveTo(X(0),Y(90));ctx.lineTo(X(0),Y(-90));
    ctx.moveTo(X(-180),Y(0));ctx.lineTo(X(180),Y(0));ctx.stroke();
    /* 陆地 */
    A.lands.forEach(Ld=>{
      pathOf(Ld.ring,true);
      ctx.fillStyle='#2c3329';ctx.fill();
      ctx.lineWidth=1;ctx.strokeStyle='rgba(150,170,130,.38)';ctx.stroke();
    });
    /* 三层叠加：人口 → 气候 → 政权 */
    if(layers.pop)drawPopulation();
    if(layers.climate)drawClimate();
    /* 内海覆回海色（热力不该盖住内海） */
    A.inlandSeas.forEach(s=>{
      pathOf(s.ring,true);ctx.fillStyle='#17242c';ctx.fill();
      ctx.strokeStyle='rgba(120,160,180,.25)';ctx.lineWidth=.8;ctx.stroke();
    });
    /* 河流 */
    A.rivers.forEach(r=>{
      pathOf(r.line,false);
      ctx.strokeStyle='rgba(105,165,205,.62)';ctx.lineWidth=Math.max(1,Math.min(2.4,view.scale*.75));ctx.stroke();
      if(view.scale>=3.4)label(r.name,X(r.line[r.line.length-1][0]),Y(r.line[r.line.length-1][1]),'#8ec5ea',10,'left');
    });
    /* 政权核心区 */
    const ps=activePolities();
    if(layers.polity)ps.forEach(p=>{
      const col=REG_COLOR[p.region]||REG_COLOR['*'];
      pathOf(p.ring,true);
      ctx.fillStyle=hexA(col,.18);ctx.fill();
      ctx.setLineDash([5,4]);ctx.lineWidth=1.3;ctx.strokeStyle=hexA(col,.9);ctx.stroke();
      ctx.setLineDash([]);
      if(view.scale>=2.6||(ps.length<=3&&view.scale>=1.6)){
        let sx=0,sy=0;p.ring.forEach(q=>{sx+=q[0];sy+=q[1];});
        label(shortName(p.name),X(sx/p.ring.length),Y(sy/p.ring.length),hexA(col,.95),Math.min(13,10+view.scale*.6));
      }
    });
    /* 航线 */
    activeRoutes().forEach(r=>{
      pathOf(r.line,false);
      ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(230,205,140,.55)';ctx.lineWidth=1.2;ctx.stroke();ctx.setLineDash([]);
      if(view.scale>=2.2)label(r.name.split('（')[0],X(r.line[Math.floor(r.line.length/2)][0]),
        Y(r.line[Math.floor(r.line.length/2)][1]),'#e2c98a',10);
    });
    /* 城址 */
    A.cities.forEach(c=>{
      if(year<c.from||year>c.to)return;
      const x=X(c.lon),y=Y(c.lat);
      if(x<0||x>cssW||y<0||y>cssH)return;
      ctx.fillStyle='#f2e7cd';ctx.fillRect(x-2,y-2,4,4);
      if(view.scale>=3)label(c.name,x+5,y,'#f2e7cd',10,'left');
    });
    /* 地理单元 */
    A.units.forEach(u=>{
      const x=X(u.lon),y=Y(u.lat);
      if(x<0||x>cssW||y<0||y>cssH)return;
      ctx.beginPath();ctx.arc(x,y,hover&&hover.id===u.id?5:2.6,0,Math.PI*2);
      ctx.fillStyle=layers.local?'#77d6c0':(u.region==='*'?'#7fb8d8':'#c9a227');ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=.8;ctx.stroke();
      if(view.scale>=4)label(u.name,x+6,y,'#d9cba8',9,'left');
    });
    /* 家族分布最上层，最清晰 */
    if(layers.family)drawFamily();
    /* 选中点 */
    if(picked){
      const x=X(picked.lon),y=Y(picked.lat);
      ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);
      ctx.strokeStyle='#ffdf8a';ctx.lineWidth=1.6;ctx.stroke();
      label(picked.name,x,y-14,'#ffdf8a',11);
    }
    /* 比例尺 / 年份 / 免责 */
    const deg=30/view.scale;
    ctx.strokeStyle='rgba(230,220,195,.7)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(14,cssH-18);ctx.lineTo(14+baseW/12*view.scale,cssH-18);ctx.stroke();
    label('约 '+Math.round(deg)+'°',14+baseW/24*view.scale,cssH-30,'#cdbf9f',10);
    label((year<0?'公元前 '+Math.abs(year)+' 年':year+' 年')+(isManual()?' · 手动查阅':' · 本局年份'),
      cssW-12,16,'#ffdf8a',11,'right');
    label('虚线＝政权核心区示意，非界线；热力＝相对重心，非人口统计',
      cssW-12,cssH-16,'rgba(230,220,195,.72)',9,'right');
    drawLegend(ps);
  }
  function drawLegend(ps){
    const rows=[],x=12,y=34;
    if(layers.polity&&ps.length)rows.push({c:'#c9a227',t:'并立政权 '+ps.length+' 个'});
    if(layers.climate)rows.push({c:'#7fa8d0',t:'气候影响区 '+activeClimate().length+' 条'});
    if(layers.pop)rows.push({c:'#e8d06a',t:'人口重心（示意）'});
    if(layers.family)rows.push({c:'#ffe08a',t:'本局家族 '+(family.dist||[]).reduce((s,d)=>s+d.count,0)+' 人'});
    if(layers.local)rows.push({c:'#77d6c0',t:'地方志图层 · 绿点关联本地史锚点'});
    if(!rows.length)return;
    ctx.fillStyle='rgba(16,20,24,.78)';ctx.fillRect(x-6,y-12,172,rows.length*17+14);
    rows.forEach((r,i)=>{
      ctx.fillStyle=r.c;ctx.fillRect(x,y+i*17-5,8,8);
      label(r.t,x+14,y+i*17,r.c,10,'left');
    });
  }

  /* ---------- 交互 ---------- */
  function emitList(force){
    const ps=activePolities(),cs=activeClimate();
    const key=year+'|'+Object.keys(layers).filter(k=>layers[k]).join(',')
      +'|'+ps.map(p=>p.id).join(',')+'|'+cs.map(c=>c.id).join(',')
      +'|'+(family.dist||[]).map(d=>d.unit+d.count).join(',');
    if(!force&&key===listKey)return;listKey=key;
    onList({year:year,polities:ps,routes:activeRoutes(),
      climate:cs,climateGlobal:cs.filter(c=>c.global).length,
      popTop:popTop(5),popEra:eraAt(year).name,
      family:family.dist||[],migrations:family.migrations||[],
      layers:Object.assign({},layers)});
  }
  function hit(sx,sy){
    let best=null,bd=14;
    /* 家族据点优先 */
    if(layers.family)(family.dist||[]).forEach(d=>{
      const k=kernelById(d.unit);if(!k)return;
      const dist=Math.hypot(X(k.lon)-sx,Y(k.lat)-sy);
      if(dist<bd){bd=dist;best={type:'family',id:d.unit,name:k.name,lat:k.lat,lon:k.lon,
        detail:'本局家族据点 · '+d.count+' 人'+(d.ruler?' · 当家在此':'')
          +'　（推演数据，不是史实人口）'};}
    });
    const scan=(arr,type)=>arr.forEach(o=>{
      if(type==='city'&&(year<o.from||year>o.to))return;
      const d=Math.hypot(X(o.lon)-sx,Y(o.lat)-sy);
      if(d<bd){bd=d;best={type:type,id:o.id,name:o.name,lat:o.lat,lon:o.lon,
        detail:type==='city'?'城址锚点 · 现代经纬度近似值':(o.fact||o.type||'')};}
    });
    scan(A.cities,'city');scan(A.units,'unit');
    /* 气候椭圆内部 */
    if(layers.climate&&!best)activeClimate().filter(c=>c.box).slice(0,8).forEach(c=>{
      const b=c.box,x=X(b.cx),y=Y(b.cy);
      const rx=Math.max(8,b.rx/360*baseW*view.scale),ry=Math.max(6,b.ry/180*baseH*view.scale);
      if(Math.pow((sx-x)/rx,2)+Math.pow((sy-y)/ry,2)<=1){
        best={type:'climate',id:c.id,name:c.title,lat:b.cy,lon:b.cx,
          detail:c.category+' · '+c.rawYear+'　'+c.caveat};}
    });
    return best;
  }
  function pickAt(sx,sy){
    const h=hit(sx,sy);picked=h;draw();
    onPick(h?{name:h.name,detail:h.detail,lat:h.lat,lon:h.lon,type:h.type,id:h.id,
      localOn:!!layers.local}:null);
  }
  function local(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  function bind(){
    cv.addEventListener('wheel',e=>{
      e.preventDefault();const p=local(e);
      zoomAt(e.deltaY<0?1.18:1/1.18,p.x,p.y);
    },{passive:false});
    cv.addEventListener('pointerdown',e=>{
      cv.setPointerCapture(e.pointerId);
      const p=local(e);pointers.set(e.pointerId,{x:p.x,y:p.y});
      dragMoved=0;
    });
    cv.addEventListener('pointermove',e=>{
      const p=local(e),prev=pointers.get(e.pointerId);
      if(!prev){
        const h=hit(p.x,p.y);
        if((h&&h.id)!==(hover&&hover.id)){hover=h;draw();}
        return;
      }
      const dx=p.x-prev.x,dy=p.y-prev.y;
      if(pointers.size>=2){
        const arr=[...pointers.values()];
        const dist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
        if(lastPinch>0&&dist>0){
          const cx=(arr[0].x+arr[1].x)/2,cy=(arr[0].y+arr[1].y)/2;
          zoomAt(dist/lastPinch,cx,cy);
        }
        lastPinch=dist;
      }else{
        view.tx+=dx;view.ty+=dy;dragMoved+=Math.abs(dx)+Math.abs(dy);
        clampView();draw();
      }
      pointers.set(e.pointerId,{x:p.x,y:p.y});
    });
    const up=e=>{
      const p=local(e),wasDrag=dragMoved>6;
      pointers.delete(e.pointerId);
      if(pointers.size<2)lastPinch=0;
      if(!wasDrag&&pointers.size===0)pickAt(p.x,p.y);
    };
    cv.addEventListener('pointerup',up);
    cv.addEventListener('pointercancel',up);
    cv.addEventListener('pointerleave',()=>{if(!pointers.size&&hover){hover=null;draw();}});
    if(!winBound){
      winBound=true;
      window.addEventListener('resize',()=>{if(cv&&cv.isConnected)resize();});
    }
  }
  function mount(canvas,opts){
    opts=opts||{};
    cv=canvas;ctx=cv.getContext('2d');
    onPick=opts.onPick||function(){};onList=opts.onList||function(){};
    year=gameYear=Math.round(opts.year||-5000);userYear=null;picked=null;hover=null;
    layers=Object.assign({polity:true,climate:true,pop:true,family:true,local:false},opts.layers||{});
    family=opts.family||{dist:[],migrations:[]};
    pointers=new Map();lastPinch=0;listKey='';
    resetView();bind();resize();emitList(true);

/* consequences.js —— 抉择后果系统（第二层）

     B 职业反哺   族中已有该业，收益 ×1.25、权重 ×1.32，卡上写明
     C 考据分歧   已见的「断代争议/传说」条目与同维度通说配对，出互斥二择一

(function(W){

  const fy=y=>y<0?'前'+Math.abs(y):String(y);

  function itemById(id){return D.civilization.items.find(x=>x.id===id);}
  function dimName(k){const d=D.civilization.dimensions.find(x=>x.key===k);return d?d.name:k;}
  function seenItems(S){
    const out=[];
    Object.keys(S.seenCiv||{}).forEach(id=>{const x=itemById(id);if(x)out.push(x);});
    return out;
  }
  function effText(e){

    const dn=D.keyOrder.filter(k=>(e||{})[k]<0).map(k=>KN[k]+'−'+Math.abs(e[k]));
    return up.concat(dn).join('　')||'无显效';

  function baseOpt(o){
    return Object.assign({kind:'govern',badge:'续',badgeName:'续作',color:'#c9a227',
      gain:{},cost:{},risk:0,fail:{},basis:null,reqText:'',unlockIds:[],

  /* ---------- A 工程：从普通原型挂起 ---------- */
  function projectFor(o,rnd){

    if(['quiz','situation'].indexOf(o.kind)>=0)return null;
    const dims=(o.basis&&o.basis.dim)?[o.basis.dim]:(o.dims||[]);
    let pool=C.projects.filter(p=>p.kinds.indexOf(o.kind)>=0

    if(!pool.length)pool=C.projects.filter(p=>p.kinds.indexOf(o.kind)>=0);
    if(!pool.length)return null;

  function startProject(o,S,pid,basisTitle,rnd){
    S.projects=S.projects||{};

    const active=Object.values(S.projects).filter(p=>p.stage<p.total);
    if(active.length>=2)return null;
    const key=pid+'_'+(S.turn||0);
    S.projects[key]={key:key,pid:pid,stage:0,total:C.projects.find(p=>p.id===pid).stages.length,
      title:basisTitle||'旧法',started:S.year,log:[]};

  function projectExtras(S,rnd){

      const st=def.stages[p.stage];if(!st)return;
      const text=String(st.text).replace(/\{title\}/g,p.title);
      const o=baseOpt({
        t:'【'+def.name+' · '+st.n+'】'+text,
        e:Object.assign({},st.eff,st.cost),
        gain:Object.assign({},st.eff),cost:Object.assign({},st.cost),
        risk:st.risk||0,fail:st.fail||{},
        kind:'build',badge:'续',badgeName:def.name+' · '+st.n,color:'#c9a227',
        archetype:'PROJ_'+p.key+'_'+p.stage,
        project:{key:p.key,pid:p.pid,stage:p.stage,stageName:st.n},
        reqText:'工程第 '+(p.stage+1)+'/'+p.total+' 笔 · '+p.title,
        basis:{title:p.title,dimName:'跨笔决议',rawYear:fy(p.started)+' 起'},

        archetype:'PROJ_ABANDON_'+p.key,

  /* ---------- D 跨维度组合技 ----------
     79 维之后，要求「指定 3—4 个维度各见过一条」几乎不可能凑齐，
     组合技会变成摆设。改为「见闻足够广 + 命中其中至少两门」：
     既保留「博观之后才打得出高阶牌」的意思，也让它在长局里真的出现。
     同一笔最多放 2 个，按命中数、已用次数与确定性扰动排序。 */
  function comboExtras(seen,S,rnd){
    const dims={};seen.forEach(x=>{dims[x.dim]=(dims[x.dim]||0)+1;});
    const dimsTotal=Object.keys(dims).length;
    if(dimsTotal<3)return [];
    const cand=[];
    C.combos.forEach(cb=>{
      const hit=cb.need.filter(d=>dims[d]>=1).length;
      const sum=cb.need.reduce((s,d)=>s+(dims[d]||0),0);
      if(hit<2||sum<2)return;
      const used=(S.optUse||{})['COMBO_'+cb.id]||0;
      if(used>=2)return;
      cand.push({cb:cb,hit:hit,sum:sum,used:used,
        score:hit*10+sum-used*5+rnd()*.6});
    });
    cand.sort((a,b)=>b.score-a.score);
    /* 题库扩到 264 道后，高阶牌容易被三择一挤没：每笔只放 1 个，但权重显著抬高 */
    return cand.slice(0,1).map(({cb,hit})=>{
      const txt=String(cb.text).replace(/\{act\}/g,cb.act);
      return baseOpt({
        t:'【组合 · '+cb.name+'】'+txt,
        e:Object.assign({},cb.eff,cb.cost),
        gain:Object.assign({},cb.eff),cost:Object.assign({},cb.cost),
        risk:cb.risk||0,fail:cb.fail||{},
        kind:cb.kind,badge:cb.badge,badgeName:'组合技',color:'#b49ad9',
        archetype:'COMBO_'+cb.id,
        combo:cb.id,
        reqText:'广博见闻 · 已见 '+dimsTotal+' 维，命中相关 '+hit+'/'+cb.need.length+' 门'
          +'（不要求凑齐全部）',
        reqNote:cb.note,
        echo:cb.echo,
        _w:2.6+rnd()*.8

    });
  }

  /* ---------- C 考据分歧：二择其一 ---------- */
  function debateExtras(seen,S,rnd){
    const disputed=seen.filter(x=>x.consensus==='date_contested'
      ||x.consensus==='legendary_retroactive');
    if(disputed.length<C.debate.minSeen)return [];
    if(rnd()>C.debate.chance)return [];
    const x=disputed[Math.floor(rnd()*disputed.length)];
    const settled=seen.find(y=>y.dim===x.dim&&y.consensus==='settled');
    const label=x.status||'断代有争议';
    return C.debate.options.map((op)=>baseOpt({
      t:'【分歧 · '+short(x.title)+'】'+op.t,

      kind:'quiz',badge:'辨',badgeName:'考据分歧',color:'#b49ad9',
      archetype:'DEBATE_'+x.id+'_'+op.id,
      debate:{item:x.id,title:x.title,status:label,choice:op.id,
        settled: settled?settled.title:null},
      reqText:C.debate.label+'　'+label+(settled?' · 通说〈'+short(settled.title)+'〉':' · 本维度无并列通说条目'),
      note:C.debate.disclaimer,

  /* ---------- C2 辨其读法：把 106 则深读卡变成可答的考据题 ----------

     正确项是分层存疑，错误项就是数据里明列的常见误解。

  function readingExtras(S,rnd,seen){
    const Q=quizData();
    if(!Q.items||!Q.items.length)return [];
    const seenDims=new Set((seen||[]).map(x=>x.dim));
    const done=S.readingSeen||{};
    const pool=Q.items.filter(x=>!done[x.id]
      &&(x.y0===undefined||(S.year>=x.y0-120&&S.year<=x.y1+120)));
    if(!pool.length)return [];
    if(rnd()>(Q.meta.chance!==undefined?Q.meta.chance:.26))return [];
    const rel=pool.filter(x=>seenDims.has(x.dim)||x.kind!=='reading');
    const src=rel.length?rel:pool;
    /* 第五轮扩容的两类题按权重优先露面，否则会被 174 道老题稀释到几乎玩不到 */
    let tot=0,r=rnd()*src.reduce((a,x)=>a+((x.kind==='surname_origin'
      ||x.kind==='term_layer')?2.2:1),0),q=src[src.length-1];
    for(const x of src){
      r-=(x.kind==='surname_origin'||x.kind==='term_layer')?2.2:1;

    }

    const mk=(txt,eff,choice)=>baseOpt({
      t:'【'+badge+' · '+(q.kind==='reading'?dimName(q.dim):'互证与称谓')+'】'+txt,

      reqNote:Q.meta.boundary,
      echo:choice==='ok'?q.okEcho:choice==='mid'?q.midEcho:q.badEcho,
      _w:1.3
    });
    return [mk(q.ok,q.okEff||{lore:6,cohesion:2},'ok'),
            mk(q.mid||'折中：先按通说落笔，异说另注',q.midEff||{lore:3,cohesion:1},'mid'),

  /* ---------- F 族账：组合技失手留下的旧账，后续可清 ----------

  function debtExtras(S,rnd){

    const debts=(S.famDebts||[]).filter(d=>!d.cleared

      reqText:'族谱旧账 · '+fy(d.y)+' 年那笔「'+short(d.t)+'」传到第 '+S.gen+' 代才收拾；'

      reqNote:'族账与清账均为游戏推演，不冒充任何真实制度。',
      echo:'上一代没收拾完的，这一代接着收拾完就算了。',

  /* ---------- 主入口：给 options.generate 的额外池 ---------- */
  function extras(ev,S,rnd,seen){

    try{out=out.concat(comboExtras(seen,S,rnd));}catch(e){}
    try{out=out.concat(debateExtras(seen,S,rnd));}catch(e){}
    try{out=out.concat(readingExtras(S,rnd,seen));}catch(e){}
    try{out=out.concat(debtExtras(S,rnd));}catch(e){}
    /* 职业反哺：给已有同业的原型加收益与权重 */
    const jobs=S.jobs||{};
    out.forEach(o=>{
      if(o.project&&o.project.abandon)return;
      const job=C.projects.find(p=>p.id===(o.project||{}).pid);
      const jobName=job?job.job:null;
      if(jobName&&jobs[jobName]){
        Object.keys(o.gain||{}).forEach(k=>{o.gain[k]=Math.round(o.gain[k]*C.jobBoost.rate);});
        o.e=Object.assign({},o.gain,o.cost);
        o.reqText=(o.reqText?o.reqText+' · ':'')+C.jobBoost.label+'「'+jobName+'」· 收效↑';
        o._w=(o._w||1)*C.jobBoost.weight;
      }
    });

  }
  /* 给普通原型也加职业反哺（在 options.weightOf 之后调用） */
  function jobBump(o,S){
    if(!o||!o.job)return o;
    const n=(S.jobs||{})[o.job]||0;
    if(!n||o.combo||o.project)return o;
    Object.keys(o.gain||{}).forEach(k=>{o.gain[k]=Math.round(o.gain[k]*C.jobBoost.rate);});
    o.e=Object.assign({},o.gain,o.cost||{});
    o.reqText=(o.reqText?o.reqText+' · ':'')+C.jobBoost.label+'「'+o.job+'」· 收效↑';

  }

  /* ---------- 选中之后：工程推进、立场、组合技账本 ---------- */
  function settle(o,S,rnd){
    const msgs=[],extra={};
    if(!o)return {msgs:msgs,extra:extra,started:null,finished:null,abandoned:null};
    /* 组合技失手 → 族谱挂一笔旧账，后续有「清账」支线 */
    if(o._riskFailed&&o.combo){
      S.famDebts=S.famDebts||[];
      S.famDebts.push({y:S.year,gen:S.gen||1,combo:o.combo,t:o.t,cleared:false});
      if(S.famDebts.length>6)S.famDebts=S.famDebts.slice(-6);

      S.mil.push({y:S.year,t:'旧账 · '+short(o.t)});

    if(o.project){

      const def=C.projects.find(x=>x.id===o.project.pid);
      if(!p||!def)return {msgs:msgs,extra:extra,started:null,finished:null,abandoned:null};
      if(o.project.abandon){
        delete S.projects[o.project.key];
        Object.keys(def.abandon).forEach(k=>{extra[k]=(extra[k]||0)+def.abandon[k];});
        msgs.push('【罢手】'+def.name+'中止，'+def.abandonText);

        S.projectLedger=S.projectLedger||{};
        Object.keys(def.ledger).forEach(k=>{
          S.projectLedger[k]=clamp((S.projectLedger[k]||0)+def.ledger[k],0,C.ledgerCap);
        });
        S.completedProjects=S.completedProjects||[];
        S.completedProjects.push({name:def.name,from:p.started,to:S.year,title:p.title,
          note:def.ledgerNote});
        if(S.completedProjects.length>12)S.completedProjects=S.completedProjects.slice(-12);
        S.mil.push({y:S.year,t:'工程既成 · '+def.name+'（'+(S.year-p.started)+' 年 / '+p.total+' 笔）'});
        msgs.push('【工程既成】'+def.name+'走完 '+p.total+' 笔。'+def.ledgerNote);
        if(def.echo){S.optEcho=S.optEcho||[];S.optEcho.push({y:S.year,t:def.echo,kind:'build'});}
        delete S.projects[o.project.key];
        return {msgs:msgs,extra:extra,started:null,finished:def.name,abandoned:null};
      }
      msgs.push('【'+def.name+' · '+def.stages[p.stage-1].n+'】已记一笔，'
        +'还差 '+(p.total-p.stage)+' 笔才验收；中途可以罢手，但投入不会退回来。');
      return {msgs:msgs,extra:extra,started:null,finished:null,abandoned:null};
    }

    if(o.debate){
      S.stances=S.stances||[];
      S.stances.push({y:S.year,title:o.debate.title,status:o.debate.status,
        choice:o.debate.choice,settled:o.debate.settled});
      if(S.stances.length>20)S.stances=S.stances.slice(-20);
      S.quiz=S.quiz||{right:0,wrong:0};
      if(o.debate.choice==='suspend')S.quiz.right++;
      const op=C.debate.options.find(x=>x.id===o.debate.choice);
      if(op&&op.echo){S.optEcho=S.optEcho||[];S.optEcho.push({y:S.year,t:op.echo,kind:'quiz'});}
      msgs.push('【取舍】关于「'+o.debate.title+'」（'+o.debate.status+'），'
        +(o.debate.choice==='suspend'?'这一族把异说一并存下，不作定论。':'这一族按通说落笔，异说另注。')
        +C.debate.disclaimer);

      return {msgs:msgs,extra:extra,started:null,finished:null,abandoned:null};

    if(o.debt){

      S.famDebts=(S.famDebts||[]).map(d=>
        (d.y===o.debt.y&&d.combo===o.debt.combo)
          ?Object.assign({},d,{cleared:true,clearedBy:head?head.id:null,
            clearedByName:head?head.name:''}):d);

      msgs.push('【清账】'+fy(o.debt.y)+' 年那笔旧账收拾完了，族里把它从待办里划掉。');

      extra.wealth=(extra.wealth||0)+2;extra.cohesion=(extra.cohesion||0)+2;
      return {msgs:msgs,extra:extra,started:null,finished:null,abandoned:null};

/* options.js —— 知识驱动选项生成器

(function(W){

      might:need('might'),cohesion:need('cohesion'),faith:need('faith'),wealth:need('wealth'),

  function weightOf(a,seen,S,rnd){

  function specialCtx(S,need,rnd,pick){

      const e=(es.length?es:(D.geoclimate.events||[]))[Math.floor(rnd()*((es.length?es:(D.geoclimate.events||[])).length||1))];
      if(!e)return null;ctx.climate=e.title||e.name;

      const L=D.localities||{items:[]};

      const now=mine.filter(x=>S.year>=x.y0-80&&S.year<=x.y1+80);
      const pool=now.length?now:mine;

    }else if(need==='surname'){

      const pool=P.surnames.filter(x=>S.year>=x.y0-200&&S.year<=x.y1+200);
      const x=(pool.length?pool:P.surnames)[Math.floor(rnd()*((pool.length?pool:P.surnames).length||1))];

      const L=D.localities||{items:[]};
      const cross=(L.items||[]).filter(x=>x.category==='互证与辨误');
      const x=cross[Math.floor(rnd()*(cross.length||1))];

        x=>S.year>=x.y0-200&&S.year<=x.y1+200),no=P.notes||[];
      const pool=su.length?su:(P.surnames||[]);

      const dim={price:'PY',risk:'RS',mineral:'GM',weather:'WO',specimen:'BC'}[need];
      const all=D.civilization.items.filter(x=>x.dim===dim);
      const now=all.filter(x=>S.year>=x.y0-120&&S.year<=x.y1+120);
      const pool=now.length?now:all;

  /* ---------- 由原型 + 依据条目造一条选项 ---------- */
  function makeOpt(a,basis,S,rnd,ctx,isSpecial,seeking){

    Object.keys(a.eff||{}).forEach(k=>{

      risk:a.risk||0,fail:a.fail||{},seeking:!!seeking,

      if(ctx.basisId){

    }

    chosen.filter(o=>o.debate).forEach(o=>{
      const pair=pool.find(x=>x.debate&&x.debate.item===o.debate.item
        &&x.debate.choice!==o.debate.choice&&!usedId.has(x.archetype));
      if(pair){usedId.add(pair.archetype);chosen.push(pair);}
    });

    chosen.filter(o=>o.reading).forEach(o=>{

      pool.filter(x=>x.reading&&x.reading.id===o.reading.id

    if(o.peopleRef){S.peopleSeen=S.peopleSeen||{};S.peopleSeen[o.peopleRef]=1;}

    if(o.job){
      S.jobs=S.jobs||{};S.jobs[o.job]=(S.jobs[o.job]||0)+1;
      if(S.jobs[o.job]===1)msgs.push('【族中业】自此有人以「'+o.job+'」为业，写进族谱。');
      /* 把「族中业」落到具体族人身上，族谱页才看得到谁习了什么、传给谁 */
      const who=W.people&&W.people.recordSkill(S,o.job);
      if(who)msgs.push('【族谱】'+who.name+' 习「'+o.job+'」，记入其生平（推演）。');
    }

    if(o.echo){
      S.optEcho=S.optEcho||[];S.optEcho.push({y:S.year,t:o.echo,kind:o.kind});
      if(S.optEcho.length>24)S.optEcho=S.optEcho.slice(-24);
    }
    if(used>=3)msgs.push('【旧法】同一路数已用 '+used+' 次，边际渐薄；往后的岔路该换一条了。');
    /* 后果层：跨笔工程推进 / 罢手、考据立场、组合技；并回传额外八维 */

      const CS=W.consequences.settle(o,S,rnd);
      CS.msgs.forEach(m=>msgs.push(m));
      Object.keys(CS.extra||{}).forEach(k=>{extra[k]=(extra[k]||0)+CS.extra[k];});
    }
    /* 迁徙类选项由 engine 改写 S.famPlaces / S.migrations，地图上的家族点才会真的移动 */
    return {msgs:msgs,extra:extra,unlockIds:o.unlockIds||[],job:o.job,echo:o.echo,
      migrate:(o.kind==='migrate'),geoTarget:o.geoTarget||null};
  }
  /* 给 UI 用的一行风险文案 */
  function riskLine(o){
    if(!o||!o.risk)return '';

    const f=Object.keys(o.fail||{}).filter(k=>o.fail[k]).map(k=>
      ({food:'粮',people:'丁',craft:'艺',lore:'文',might:'兵',cohesion:'聚',faith:'信',wealth:'财'}[k]||k)
      +'−'+Math.abs(o.fail[k])).join('、');

        const u=pool[Math.min(Math.floor(i/2),pool.length-1)];

      if(!id||!unitById(id)){          // 新生儿或旧档缺登记，就地补到本圈地理单元
        id=fallback.id;

  /* 代入真实家族 / 王朝 / 文明：从「建立」之年入局，六阶段按考据年表推进 */

  const eraIdx=y=>{for(let i=0;i<D.eras.length;i++)if(y>=D.eras[i].from&&y<D.eras[i].to)return i;return D.eras.length-1;};

  const TAG_RULES={
    '初耕':{food:2},'灌溉':{food:2,people:1},'识字':{lore:2,cohesion:1},
    '立册':{lore:2,cohesion:1},'藏书':{lore:2},'远客':{wealth:2},'丝路':{wealth:2,craft:1},
    '造纸':{lore:2,craft:1},'活字':{lore:2},'火药':{might:2,craft:1},
    '铁器':{food:1,craft:2,might:1},'都江堰':{food:2},'科举':{lore:2,cohesion:2},
    '市舶':{wealth:2},'交子':{wealth:2},'乐律':{cohesion:2,lore:1},
    '法典':{cohesion:2,lore:1},'航海':{wealth:2,craft:1},'罗盘':{wealth:1,craft:2},
    '祠祀':{faith:2,cohesion:1},'立碑':{lore:1,cohesion:1},'结盟':{cohesion:2,might:1},
    '筑城':{might:2,cohesion:1},'通商':{wealth:2},'行会':{wealth:1,craft:1}

  function ledger(){
    const out={};D.keyOrder.forEach(k=>out[k]=0);
    Object.keys(S.tags||{}).forEach(t=>{
      const r=TAG_RULES[t],n=Math.min(3,S.tags[t]||1);
      if(r)D.keyOrder.forEach(k=>out[k]+=(r[k]||0)*n);
      else out.cohesion+=n;   // 未列名的旧例一律折算为族和
    });

    if(W.consequences){

  function drift(years){
    const st=S.st,ei=eraIdx(S.year),k=clamp(years/30,.4,3);
    const L=ledger(),tagN=Object.keys(S.tags||{}).length;
    const M=W.reality.mode(S.modeKey),DF=W.difficulty?W.difficulty.drift(S):1;
    /* 玩法 pressure × 难度 drift：难度只改岁月衰减，不改史实频率 */
    const P=(M.pressure||1)*DF;
    // 旧例越多，族和衰减越慢；存续模式与困难档放大衰减
    const decay=clamp((1.6-tagN*.06)*P,.4,3.2);
    st.food+=Math.round((L.food*0.5)-S.st.people/60*k+rnd()*3-1-(P>1.4?1:0));
    st.people+=Math.round((st.food>45?2:st.food<18?-2:0)*k+rnd()*2-1+(L.people*.3));
    st.craft+=Math.round((ei>=5?1.4:.6)*k+rnd()*2-1+L.craft*.5);
    st.lore+=Math.round((.5+L.lore*.5)*k+rnd()*2-1+(L.lore*.3));
    st.cohesion+=Math.round((rnd()*3-decay)*k+L.cohesion*.4);

  function fill(s){

     没有 entityLinks 的实体（如莫卧儿）退化为按年代窗口 + 区域取池。 */
  function entityCivPool(S){
    const ids=D.succession.entityLinks[S.entity.id]||[];
    const t0=W.reality.tier(S.reality);
    const seen=S.seenCiv||{},ent=W.real.entityById(S.entity.id);

    let pool=ids.length?unseen.filter(x=>ids.indexOf(x.id)>=0):[];
    if(!pool.length&&ent){
      pool=unseen.filter(x=>x.y0<=ent.endYear+40&&x.y1>=ent.startYear-40
        &&(x.region===S.reg||x.region==='*'));

    if(!pool.length&&ids.length)pool=D.civilization.items.filter(x=>ids.indexOf(x.id)>=0&&allows(x));

  function pickEvent(){

    if(S.mode==='real'||S.mode==='succession'){
      if(S.entity.phaseChanged){
        S.entity.phaseChanged=false;
        const ev=W.real.phaseEvent(S);
        if(S.mode==='succession'){
          const l=W.succession.link(S);

      const l=W.succession.link(S);

        &&W.reality.allows(t0,x.layer||'fact',x));

      if(S.chainState.entityTurn<=4){

  function effDesc(e){

      S.mil.push({y:S.year,t:'文明 · '+x.dimName+'／'+x.title});

          S.quiz.right++;S.score+=6;

          S.mil.push({y:S.year,t:'考据 · 辨传说 '+x.title});
        }else{

      S.shortEnd=!!(LEN.maxVol&&S.vol.n>=LEN.maxVol);
      S.mil.push({y:S.year,t:'卷 '+S.vol.n+' 毕 · '+WV.volTitle(S.vol.n)});
      S.log.push({y:S.year,t:'卷 '+S.vol.n+'「'+WV.volTitle(S.vol.n)+'」至此汇流，共 '+volLen()+' 笔。',k:'era'});

  function step(){
    if(S.phase==='choice'&&!S.cur)S.phase='result';
    if(S.phase!=='result')return;
    const isReal=S.mode==='real'&&!(S.entity&&S.entity.endedShown),
          isChain=S.mode==='succession'&&!(S.entity&&S.entity.endedShown),
          prevEra=eraIdx(S.year);
    let dt,famYears;
    if(isChain){
      const prevYear=S.year;
      S.chainState.entityTurn++;
      S.turn++;
      S.year=W.succession.yearAt(S);
      if(S.year===0)S.year=1;
      // 更迭跳年（如 220 → 618）允许年份前跳；同朝内保持不倒退
      if(S.year<prevYear&&S.chainState.entityTurn>1)S.year=prevYear;
      const np=W.succession.phaseIdx(S);
      S.entity.phaseChanged=(np!==S.entity.phaseIdx);
      S.entity.phaseIdx=np;
      dt=Math.max(1,Math.min(30,Math.abs(S.year-prevYear)));
      famYears=Math.min(14,dt+3);

      S.turn++;

      const np=W.real.phaseIdxAt(S.turn-1);
      S.entity.phaseChanged=(np!==S.entity.phaseIdx);
      S.entity.phaseIdx=np;
      dt=Math.max(1,Math.abs(S.year-prevYear));

    }else{
      dt=stepSize();const first=(S.turn===0);
      S.year+=dt;if(S.year>=0&&S.year<1)S.year=1;if(S.year===0)S.year=1;
      S.turn++;

    }

    if(W.kinship)W.kinship.matchUnmarried(S,rnd);
    F.advanceFamily(S,famYears,rnd,pick);
    drift(dt);

    if(ei!==prevEra){
      S.era=ei;S.st.lore=clamp(S.st.lore+4,0,100);S.st.craft=clamp(S.st.craft+3,0,100);
      S.mil.push({y:S.year,t:'入新纪 · '+D.eras[ei].n});
      S.log.push({y:S.year,t:'时代推移，进入「'+D.eras[ei].n+'」。',k:'era'});
    }
    const ev=pickEvent();ev.opts=buildOpts(ev);
    S.cur=ev;S.phase='choice';S.result=null;
    S.score+=Math.round(S.st.people+S.st.lore+S.st.craft)/20;
    save();
  }
  function continueVolume(){

  const DYNASTY_FAMILY=[

      try{

  /* 本局编年时间轴：卷界 / 史事 / 迁徙 / 工程 / 当前，横向一屏看完这一局 */
  function timelineHTML(S){
    const from=(S.log&&S.log.length&&S.log[0].y)||-5000,to=Math.max(S.year,from+1);
    const span=Math.max(1,to-from);
    const pct=y=>Math.max(0,Math.min(100,(y-from)/span*100));
    const vols=(S.volLog||[]).map(v=>v.to).filter(y=>y>=from&&y<=to);
    const marks=[];
    const scan=(arr)=>(arr||[]).forEach(l=>{
      if(!l||l.y<from||l.y>to||!l.t)return;
      let kind=null;
      if(l.t.indexOf('【家族 · 推演】')===0||l.t.indexOf('家族迁徙')>=0)kind='fam';
      else if(l.t.indexOf('工程')>=0||l.t.indexOf('立项')>=0||l.t.indexOf('研习')>=0)kind='work';
      else if(/亲历|终章|更迭|阶段|入新纪|文明 ·|气候 ·|立例/.test(l.t))kind='hist';
      if(kind)marks.push({y:l.y,kind:kind,t:l.t});
    });
    scan(S.log);scan(S.mil);
    const color={fam:'#f0be6e',work:'#b49ad9',hist:'#7fc7a0'};
    let h='<div class="card"><div class="tagline">本 局 编 年 时 间 轴</div>'
      +'<div class="mini">左端 '+E.fmtShort(from)+'，右端 '+E.fmtShort(to)+'（本局当前年份）。'
      +'绿点＝亲历史事／更迭，橙点＝家族迁徙，紫点＝工程节点，竖线＝卷界。'
      +'位置按年份线性排布；远古一笔跨百年，故点位疏密不表示事件频率。</div>'
      +'<div class="tlwrap"><div class="tlbase"></div>';
    vols.forEach(y=>{h+='<i class="tlvol" style="left:'+pct(y)+'%"></i>';});
    marks.slice(-46).forEach(m=>{
      h+='<i class="tlmark" style="left:'+pct(m.y)+'%;background:'+color[m.kind]+'" title="'
        +esc(E.fmtShort(m.y)+' '+m.t.slice(0,40))+'"></i>';
    });
    h+='<i class="tlnow" style="left:'+pct(to)+'%"></i></div>'
      +'<div class="tlrow"><span>'+E.fmtShort(from)+'</span><span style="color:var(--gold)">'
      +E.fmtShort(to)+' · 当前</span></div>'
      +'<div class="mini" style="margin-top:6px">共 '+vols.length+' 道卷界、'+marks.length+' 个可标节点，'
      +'第 '+(S.vol?S.vol.n:1)+' 卷。轴只按本局已发生的编年绘制，不补写未至之世。</div></div>';
    return h;
  }

  /* 同期人物：按本局年份与年代窗口重叠筛真实人物，纯展示、不摇随机数、不改史实 */
  function contemporaries(S){
    const y=S.year,all=D.civilization.items.filter(x=>x.dim==='P'&&x.layer!=='framework');
    const sorted=all.slice().sort((a,b)=>Math.abs(a.y0-y)-Math.abs(b.y0-y));
    const hit=sorted.filter(x=>x.y0<=y+20&&x.y1>=y-20).slice(0,3);
    if(!hit.length){
      const near=sorted.slice(0,2);
      if(!near.length)return '';
      let hh='<div class="card" style="margin-top:10px;padding:13px"><div class="tagline">同 期 人 物 · '
        +'本年前后暂无年代窗口重叠者</div>'
        +'<div class="mini">册中距本年最近的可考人物：</div>';
      near.forEach(x=>{hh+='<div class="row"><b>'+esc(x.title)+'</b> <span class="s">'
        +esc(x.rawYear)+'</span><div class="mini">'+esc(x.summary)+'</div></div>';});
      hh+='<div class="mini" style="color:var(--dim)">只作年代参照，不表示与本年或本局有关。</div></div>';
      return hh;
    }
    let h='<div class="card" style="margin-top:10px;padding:13px"><div class="tagline">同 期 人 物 · '
      +'年代窗口与本年重叠</div>';
    hit.forEach(x=>{
      h+='<div class="row"><b>'+esc(x.title)+'</b> <span class="s">'+esc(x.rawYear)
        +' · '+esc(x.category)+'</span><div class="mini">'+esc(x.summary)+'</div>'
        +(x.consensus==='date_contested'?'<div class="mini" style="color:var(--gold)">断代有争议</div>':'')
        +'</div>';
    });
    h+='<div class="mini" style="color:var(--dim)">只表示年代窗口重叠，不表示隶属本局政权、'
      +'不与本局推演族人有关，也不据此改写任何人物生平。</div></div>';
    return h;
  }

        :ev.isCiv?'考据标注':ev.isHist?'史海钩沉':'说明';
      if(ev.note)h+='<div class="'+noteCls+'"><b>'+noteTitle+'：</b>'+esc(ev.note)+'</div>';

          +'<div class="row"><b>'+esc(ev.bio.name)+'</b> <span class="s">生 '+esc(ev.bio.born)+' · 活动 '+esc(ev.bio.active)+'</span>'
          +'<div class="mini">著述／事迹：'+esc(ev.bio.work)+'</div>'
          +'<div class="mini">身后影响：'+esc(ev.bio.legacy)+'</div></div></div>';
      }
      if(ev.treasure){
        const t=ev.treasure;
        h+='<div class="card" style="margin-top:10px;padding:13px"><div class="tagline">鉴 宝 卡 · '+esc(t.name)+'</div>'
          +'<div class="volgrid">'
          +'<div>年代<b>'+esc(t.rawYear)+'</b></div>'
          +'<div>材质<b>'+esc(t.material)+'</b></div>'
          +'<div>出土／传世<b>'+esc(t.provenance)+'</b></div>'
          +'<div>现藏<b>'+esc(t.museum)+'</b></div>'
          +'</div><div class="mini" style="margin-top:8px">鉴定要点：'+esc(t.points)+'</div>'
          +'<div class="mini">断代／真伪争议：'+esc(t.dispute)+'</div></div>';
      }
      if(ev.isCiv&&ev.civMeta&&ev.civMeta.sources&&ev.civMeta.sources.length){
        const q=ev.civMeta.sources.find(s=>s.quote);

          +esc(W.civilization.RANK_LABEL[q.rank]||'出处')+'）：'+esc(q.quote.slice(0,90))
          +(q.quote.length>90?'…':'')+'</div>';

        const gain=D.keyOrder.filter(k=>(o.gain||{})[k]>0)
          .map(k=>D.keys[k]+'+'+o.gain[k]).join('　');

        let extra='';
        if(o.basis)extra+='<span class="basis">依据 · '+esc(o.basis.title)

          +(o.basis.rawYear?' · '+esc(o.basis.rawYear):'')+'</span>';

        else if(o.isSpecial)extra+='<span class="basis">据本局舆地／同期数据生成</span>';
        if(o.project&&!o.project.abandon)extra+='<span class="basis seek">跨笔决议 · 选中后继续推进，'
          +'验收才有长期增益；也可在后续笔里罢手</span>';
        if(o.combo)extra+='<span class="basis">组合技 · 需多条不同维度知识同时在册</span>';
        if(o.debate)extra+='<span class="basis">考据分歧 · 两条互斥，选一条即作取舍</span>';
        const risk=o.risk?'<span class="risk">⚠ '+esc(W.options.riskLine(o))+'</span>':'';
        const req=o.reqText?'<span class="req">'+esc(o.reqText)+'</span>':'';

          +esc(o.reqNote||o.note)+'</span>':'';

          +(cost?'<i class="cost">'+esc(cost)+'</i>':'')+'</span>':'';

      });
      let tail='<div class="mini" style="margin-top:8px">选项由已见知识、八维态势、地理气候与同期政权生成；'
        +'代价／风险／前置／跨笔决议都写在卡上；史实条目只作依据，抉择与后果均为游戏推演。</div>';
      if(HN>=2){
        const CH=W.difficulty.cardHelp;
        tail+='<details class="fold" '+(S.turn<2?'open':'')+'><summary>怎 么 读 这 些 卡 · 简 单 模 式 逐 条 解 释</summary>'

            '<div class="mini"><b>'+esc({gain:'绿色收益',cost:'红色代价',risk:'⚠ 失手',
              basis:'依据',req:'前置',project:'跨笔决议',recommend:'新手建议'}[k])+'：</b>'
            +esc(CH[k])+'</div>').join('')
          +'<div class="mini" style="color:var(--dim)">卡上数字已被难度调整过，你看到的就是真正会发生的；'
          +'难度不改史实。</div></details>';
      }
      return h+tail+'</div></div>';
    }
    const r=S.result||{o:{t:'（续卷）',e:{}},msgs:[]};
    return '<div class="card"><div class="tagline">已 落 笔</div><h2>'+esc(r.o.t)+'</h2>'
      +'<div class="result">'+E.effDesc(r.o.e)+(r.msgs.length?'<br>'+r.msgs.join(' '):'')+'</div>'
      +'<p class="story" style="margin-top:12px">'+E.fmtYear(S.year)+'，这一笔已入编年。再往前，岁月不等人。</p>'
      +contemporaries(S)
      +'<button class="big" data-act="next">继 续 推 演 ▸</button>'
      +'<button class="big alt" data-act="scroll">随 时 收 卷</button></div>';

      let dirty=false;
      if(S.phase==='scroll'&&W.tutorial.noteScroll(S))dirty=true;
      if(W.tutorial.advance(S))dirty=true;

    const e=D.eras[E.eraIdx(S.year)],V=D.views[S.view],R=D.regions[S.reg];
    let h='<div class="head"><div><div class="yr">'+E.fmtYear(S.year)+'</div>'

        applyZoom();
      }));
      kinSvg.querySelectorAll('.kgn').forEach(g=>g.addEventListener('click',()=>{
        const id=g.dataset.id,St=E.state();
        kinSvg.querySelectorAll('.kgn').forEach(x=>x.classList.toggle('dim',x.dataset.id!==id));
        kinSvg.querySelectorAll('.kge').forEach(l=>l.classList.toggle('on',
          l.dataset.a===id||l.dataset.b===id));
        const p=(St.fam||[]).find(x=>x.id===id);
        const box=document.getElementById('kinPick');
        if(!p||!box)return;
        const rel=W.kinship.relationsOf(St,p).filter(r=>r.who&&r.who!==p.id);
        box.innerHTML='<b>'+esc(p.name)+'</b>（第 '+p.gen+' 代 · '
          +(p.gender==='female'?'女':p.gender==='male'?'男':'未记')+'）　'
          +rel.length+' 条称谓<br>'+(rel.length?rel.map(r=>esc(r.term)+'·'+esc(r.whoName)).join('　')
            :'尚无可从在册关系链推出的称谓。');
      }));
    }
    const fillAll=()=>lazyEls.forEach(d=>{d.open=true;fillLazy(d);});
    const ppIn=document.getElementById('ppSearch');
    if(ppIn)ppIn.addEventListener('input',()=>{
      const q=ppIn.value.trim();
      if(q)fillAll();
      /* 清空检索：收起全部组；已载入内容留在 body 里，下次点开不用重拼 */
      else lazyEls.forEach(d=>{d.open=false;LAZYOPEN.delete(d.dataset.lz);});
      /* 优化轮：1295 条姓氏全量匹配时一次显示上千行，手机既卡又没法看。
         只露前 60 条，写明总数；条目一条没删，清空检索仍可逐组翻。 */
      const MAXSHOW=60;let shown=0,total=0;
      document.querySelectorAll('#ppList .pp-row').forEach(r=>{
        const hit=!q||r.textContent.indexOf(q)>=0;
        if(hit)total++;
        const show=hit&&(!q||shown<MAXSHOW);
        if(show)shown++;
        r.style.display=show?'':'none';
      });
      document.querySelectorAll('#ppList .pp-group').forEach(g=>{
        if(q)g.open=true;
        const vis=Array.prototype.some.call(g.querySelectorAll('.pp-row'),
          r=>r.style.display!=='none');
        g.style.display=vis?'':'none';
      });
      const cnt=document.getElementById('ppCount');
      if(cnt)cnt.textContent=q?('匹配 '+total+' 条 · 显示前 '+shown+' 条'

        T.next(S2);
      }else if(a==='prev')T.prev(S2);
      else if(a==='skip')T.skip(S2);
      else if(a==='reopen'){T.reopen(S2);TAB='main';}
      else if(a==='on')T.reopen(S2);
      else if(a==='off')T.setOn(S2,false);

    app.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{E.setView(b.dataset.view);render();}));

    /* 五层可缩放历史舆图：每次渲染重建 canvas，重新挂载 */

        onPick:function(p){

          const kind={city:'城址锚点（现代经纬度近似）',unit:'地理单元（近似中心点）',

            :'点一下地图上的点位，可查看该地说明。';
          /* 点中地理单元且地方志层开启 → 展开该单元的全部本地史锚点 */
          if(p&&p.type==='unit'&&p.localOn&&p.id){
            const ls=D.localities.items.filter(function(x){return x.geoId===p.id;});
            if(ls.length){
              html+='<div class="hr"></div><div class="tagline">本 地 方 志 · '+ls.length+' 条</div>';
              html+=ls.map(function(x){

                  +'<span class="s">'+esc(x.category)+'</span>'
                  +'<div class="mini">'+esc(x.summary)+'</div>'
                  +'<div class="mini" style="color:var(--gold)">'+esc(x.boundary)+'</div>'
                  +(x.consensus==='date_contested'?'<div class="mini">断代有争议</div>':'')+'</div>';

          box.innerHTML=html;
        },
        onList:function(o){
          const box=document.getElementById('atlasList');if(!box)return;
          let t='';
          /* 1 政权 */
          if(o.layers.polity){
            t+='<div class="tagline">政 权 · '+E.fmtYear(o.year)+' · '+o.polities.length+' 个并立</div>';
            t+='<div class="mini">并立政权同时显示，不排成前后相续单线；虚线仅示核心区，不是界线。</div>';
            t+=o.polities.length?o.polities.map(function(p){
              return '<div class="row"><b>'+esc(p.name)+'</b> <span class="s">'
                +E.fmtShort(p.from)+' — '+E.fmtShort(p.to)+'</span>'
                +'<div class="mini">'+esc(p.note)+'</div></div>';
            }).join(''):'<div class="mini">该年份本图未收录示意政权。</div>';
          }
          /* 2 气候 */
          if(o.layers.climate){
            t+='<div class="hr"></div><div class="tagline">气 候 · 同期 '+o.climate.length+' 条'
              +'（全球性 '+o.climateGlobal+' 条）</div>';
            t+='<div class="mini">'+esc(D.layers.meta.climateNote)+'</div>';
            t+=o.climate.length?o.climate.slice(0,6).map(function(c){
              return '<div class="row"><span class="y">'+esc(c.rawYear)+'</span><b>'+esc(c.title)+'</b>'
                +'<span class="s">'+esc(c.category)+'</span>'
                +'<div class="mini">'+esc(c.summary.slice(0,58))+'…</div>'
                +'<div class="mini" style="color:var(--red2)">'+esc(c.caveat)+'</div></div>';
            }).join(''):'<div class="mini">该年份无标注气候事件。</div>';
            if(o.climate.length>6)t+='<div class="mini">…另有 '+(o.climate.length-6)+' 条，见下方气候编年。</div>';
          }
          /* 3 人口热力 */
          if(o.layers.pop){
            t+='<div class="hr"></div><div class="tagline">人 口 重 心 · '+esc(o.popEra)+'</div>';
            t+='<div class="mini">'+esc(D.layers.meta.populationNote)+'</div>';
            t+='<div class="mini" style="margin-top:4px">相对权重较高的地理单元：'
              +o.popTop.map(function(p){return esc(p.name)+' '+Math.round(p.w*100)+'%';}).join('　')
              +'（百分比只是示意权重，不是人口占比）</div>';
          }
          /* 4 家族分布 */
          if(o.layers.family){
            t+='<div class="hr"></div><div class="tagline">本 局 家 族 分 布 · '+o.family.length+' 处</div>';
            t+='<div class="mini">'+esc(D.layers.meta.familyNote)+'</div>';
            t+=o.family.length?o.family.map(function(d){
              return '<div class="row"><b>'+esc(d.name)+'</b> <span class="s">'+d.count+' 人'
                +(d.ruler?' · 当家在此':'')+'</span></div>';
            }).join(''):'<div class="mini">族中暂无在籍落脚点。</div>';
            if(o.migrations.length)t+='<div class="mini" style="margin-top:6px;color:var(--gold)">迁徙足迹：'
              +o.migrations.slice(-4).map(function(m){
                return E.fmtShort(m.y)+' '+esc(m.fromName)+' → '+esc(m.toName)+'（'+m.count+' 人）';
              }).join('　')+'</div>';
          }
          /* 5 地方志：本圈 + 全球性，按当前年份窗口筛选，不作范围主张 */
          if(o.layers.local){
            const LS=D.localities.items.filter(function(x){
              return (x.region===S.reg||x.region==='*')&&o.year>=x.y0-120&&o.year<=x.y1+120;
            }).sort(function(a,b){return a.y0-b.y0;});
            t+='<div class="hr"></div><div class="tagline">地 方 志 · '+E.fmtYear(o.year)
              +' 前后可见 '+LS.length+' 条（全册 '+D.localities.items.length+' 条 / '+new Set(D.localities.items.map(function(v){return v.geoId;})).size+' 地 · 每地 6 类）</div>';
            t+='<div class="mini">'+esc(D.localities.meta.boundary)+'</div>';
            t+=LS.length?LS.slice(0,10).map(function(x){
              const u=D.atlas.units.find(function(v){return v.id===x.geoId;});
              return '<div class="row"><span class="y">'+esc(x.rawYear)+'</span><b>'+esc(x.title)+'</b>'
                +'<span class="s">'+esc(u?u.name:x.geoId)+' · '+esc(x.category)+'</span>'
                +'<div class="mini">'+esc(x.summary.slice(0,54))+'…</div></div>';
            }).join(''):'<div class="mini">该年份窗口内暂无已收录的本圈地方史锚点，拖动年份滑杆再试。</div>';
            if(LS.length>10)t+='<div class="mini">…另有 '+(LS.length-10)+' 条，点地图上的单元圆点可看该地全部六类。</div>';
            t+='<div class="mini" style="margin-top:4px;color:var(--dim)">'
              +esc(D.localities.meta.density)+'</div>';
          }
          if(o.routes.length)t+='<div class="mini" style="margin-top:6px;color:var(--gold)">同期航线：'
            +o.routes.map(function(r){return esc(r.name);}).join('、')+'（简化示意，非精确航迹）</div>';
          box.innerHTML=t;
        }});
      const yr=document.getElementById('atlasYear');
      if(yr)yr.addEventListener('input',function(){
        const v=+yr.value;AT.setYear(v,false);
        const lb=document.getElementById('atlasYearLabel');if(lb)lb.textContent=E.fmtYear(v);
      });
    }
    app.querySelectorAll('[data-layer]').forEach(b=>b.addEventListener('click',function(){
      if(!AT)return;
      const k=b.dataset.layer;
      ATL[k]=!ATL[k];
      AT.setLayers(ATL);
      const names={polity:'政权',climate:'气候',pop:'人口热力',family:'家族',local:'地方志'};
      b.className=ATL[k]?'on':'';
      b.textContent=(ATL[k]?'✓ ':'＋ ')+names[k];
    }));
    app.querySelectorAll('[data-atlas]').forEach(b=>b.addEventListener('click',function(){
      if(!AT)return;
      const a=b.dataset.atlas;
      if(a==='in')AT.zoom(1.35);
      else if(a==='out')AT.zoom(1/1.35);
      else if(a==='reset')AT.reset();
      else if(a==='follow'){
        AT.followGame();
        const y2=document.getElementById('atlasYear'),lb=document.getElementById('atlasYearLabel');
        if(y2)y2.value=Math.max(-3100,Math.min(2026,AT.getYear()));
        if(lb)lb.textContent=E.fmtYear(AT.getYear());
      }
    }));
    app.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.act;
      if(a==='next')E.step();
      else if(a==='contvol')E.continueVolume();
      else if(a==='epilogue')E.epilogue();
      else if(a==='realend-cont')E.realEndContinue();
      else if(a==='nextdyn')E.nextDynasty();
      else if(a==='scroll'){E.openScroll(false);TAB='main';}
      else if(a==='scroll-final'){E.openScroll(true);TAB='main';}
      else if(a==='backscroll')E.backFromScroll();
      else if(a==='restart'){E.restart();TAB='main';}
      else if(a==='exportall')download('wqn-saves.json',E.exportAll(),'application/json');
      else if(a==='importall')pickFile(txt=>{if(E.importAll(txt)){TAB='main';render();}else alert('存档格式不对，或不是本游戏导出的文件。');});
      else if(a==='copyshare')copyText(E.shareString());
      else if(a==='replay'){
        const s=window.prompt('粘贴分享串（WQN1. 开头），生成同种子对照局：','');
        if(s){const g=E.replay(s.trim());if(!g)alert('分享串无法解析。');render();}
      }
      else if(a==='clearghost'){E.clearGhost();render();}
      else if(a==='exportpng')exportScrollPNG(E.state());
      render();
    }));
    applyDisplay();
  }
  function applyDisplay(){
    if(typeof document==='undefined')return;
    const r=document.documentElement;
    r.style.setProperty('--fs',FS===0?'1':FS===1?'1.12':'1.25');
    r.classList.toggle('hc',HC===1);
  }
  function download(name,text,mime){
    try{
      const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
    }catch(e){alert('浏览器不支持下载，可改用「复制分享串」。');}
  }
  function pickFile(cb){
    const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
    i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;
      const r=new FileReader();r.onload=()=>cb(String(r.result));r.readAsText(f,'utf-8');};
    i.click();
  }
  function copyText(t){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);}
      else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
      alert('分享串已复制。');
    }catch(e){window.prompt('手动复制分享串：',t);}
  }
  /* 收卷长图：canvas 逐行排版，离线生成 PNG */
  function exportScrollPNG(S){
    const d=WV.scrollData(S,true);
    const lines=[];
    const push=(t,sz)=>lines.push({t:String(t||''),sz:sz||14});
    push('上下五千年 · 无尽编年　收卷',22);
    push(E.fmtYear(-5000)+' — '+E.fmtYear(d.to)+'　共 '+d.turn+' 笔 / '+d.vol+' 卷',15);
    push('传承度 '+d.score+'　第 '+d.gen+' 代　'+d.verdict,13);
    push('档位 '+W.reality.banner(S)+'　史料密度 '+W.reality.density(S.density).name,12);
    push('',10);
    push('【舆地】已历气候 '+Object.keys(S.climateSeen||{}).length+' / '+D.geoclimate.events.length,16);
    push(W.geoclimate.CAVEAT.slice(0,46),11);
    push('地理单元 '+D.geoclimate.units.length+' 个，经纬度为近似中心点，非地域图',11);
    push('',10);
    if(d.chain){push('【朝代长河】'+d.chain.title,16);
      d.chain.entities.forEach((x,i)=>push((i+1)+'. '+x.name+'　'+E.fmtShort(x.from)+'—'+E.fmtShort(x.to),13));}
    if(d.entity){push('【真实血脉】'+d.entity.name,16);
      d.entity.phases.forEach(p=>push(p.phase+'　'+p.label+'　'+p.event,12));}
    push('',10);
    push('【八维终值】',16);
    push(D.keyOrder.map(k=>D.keys[k]+' '+d.st[k]).join('　'),13);
    push('',10);
    push('【文明册】'+d.civ.seen.length+' / '+d.civ.total,16);
    d.civ.byDim.forEach(x=>push(x.name+'　'+x.got+' / '+x.total,13));
    push('',10);
    push('【所见史事】'+d.hist.length,16);
    d.hist.slice(0,18).forEach(x=>push(E.fmtShort(x.y0)+'　'+x.title,12));
    push('',10);
    push('【族谱】在籍 '+d.alive.length+'　凋零 '+d.dead,16);
    d.alive.slice(0,10).forEach(p=>push(p.gen+'代　'+p.name+'　'+p.trait,12));
    push('',10);
    push('史实为通识级考据整理，推演抉择不改写史实。',11);
    try{
      const CW=760,pad=28,lh=26,H=pad*2+lines.reduce((a,l)=>a+(l.sz>=20?38:l.sz>=16?30:lh),0);
      const cv=document.createElement('canvas');cv.width=CW;cv.height=Math.max(H,400);
      const c=cv.getContext('2d');
      c.fillStyle='#14110e';c.fillRect(0,0,CW,cv.height);
      c.strokeStyle='#4a3c2a';c.strokeRect(10,10,CW-20,cv.height-20);
      let y=pad+18;
      lines.forEach(l=>{
        c.fillStyle=l.sz>=20?'#c9a227':l.sz>=16?'#e8dcc2':'#ddd0b4';
        c.font=l.sz+'px "WenQuanYi Micro Hei",sans-serif';
        c.fillText(l.t.slice(0,52),pad,y);
        y+=l.sz>=20?38:l.sz>=16?30:lh;
      });
      const a=document.createElement('a');a.href=cv.toDataURL('image/png');
      a.download='wqn-收卷.png';document.body.appendChild(a);a.click();
      setTimeout(()=>a.remove(),600);
    }catch(e){alert('当前浏览器无法生成长图，可改用「导出全部存档」保存文字数据。');}
  }
  function renderStart(app){

      +' 条、人群 '+D.peoples.peoples.length+' 条与深读卡 '+D.deepdives.items.length+' 则，'
      +'从书写、典籍、地图测绘、刑狱、户籍、情报、蒙学、日常器用、性别史、育幼、生业、地力、专榷、行旅、档案、论辩、典藏、赈济、传媒、知识产权到精神与心理，按年代登场；'
      +'越过今日之后，进入明确标注的虚构推演。</div></div>';
    if(cached){
      h+='<div class="card"><div class="tagline">旧 卷 尚 在</div><div class="mini">'+E.fmtYear(cached.year)+' · '+D.regions[cached.reg].n
        +' · 第 '+cached.turn+' 笔 · 卷 '+(cached.vol?cached.vol.n:1)+' · '+D.views[cached.view].n+'视角</div>'
        +'<button class="big" data-act="resume">续 接 旧 卷</button></div>';
    }
    /* 难度与新手教程：放在最前面，第一次玩不会迷路 */
    const DF=W.difficulty,TT=W.tutorial,curD=DF.tier(START.difficulty);
    h+='<div class="card"><div class="tagline">新 手 教 程 · 与 难 度</div>'
      +'<div class="mini">难度只改推演数值与指引多少（危机触发线属推演层，会间接影响某一笔遇到什么），'
      +'<b style="color:var(--gold)">不改任何史实</b>：史实条目、年代、出处、可信度、舆图、玩法档位与史料密度一律照旧。</div>'
      +'<div class="viewsel" style="margin-top:9px">';
    DF.DIFFS.forEach(d=>h+='<button data-diff="'+d.key+'" class="'+(START.difficulty===d.key?'on':'')+'">'+d.name+'</button>');
    h+='</div><div class="note" style="margin-top:8px"><b>'+esc(curD.name)+'：</b>'
      +esc(curD.desc)+'<div class="mini" style="margin-top:4px">'+esc(curD.note)+'</div></div>'
      +'<div class="tuton" style="margin-top:9px"><label><input type="checkbox" data-tuton="1" '
      +(START.tutorialOn?'checked':'')+'> 开启新手教程（'+TT.STEPS.length+' 步，跟着点一遍就会玩）</label>'
      +'<div class="mini">简单模式默认开启，且全程多一层逐卡指引与「新手建议」；普通／困难默认关闭，可随时打开。</div></div>'
      +'<details class="fold" style="margin-top:8px"><summary>先 看 一 眼 教 程 讲 什 么 · '+TT.STEPS.length+' 步</summary>'
      +TT.STEPS.map((x,i)=>'<div class="row"><span class="y">'+(i+1)+'</span><b>'+esc(x.title)+'</b>'
        +'<div class="mini">'+esc(x.body)+'</div></div>').join('')
      +'<div class="mini" style="color:var(--dim)">'+esc(TT.meta.note)+'</div></details></div>';
    h+='<div class="card"><div class="tagline">择 一 文 明 圈</div><div class="sel">';
    Object.keys(D.regions).forEach(k=>h+='<button data-reg="'+k+'" class="'+(START.reg===k?'on':'')+'">'+D.regions[k].n+'<div class="mini" style="color:var(--dim);margin-top:4px">'+D.regions[k].d+'</div></button>');
    h+='</div><div class="tagline">择 一 视 角</div><div class="viewsel">';
    Object.keys(D.views).forEach(k=>h+='<button data-v="'+k+'" class="'+(START.view===k?'on':'')+'">'+D.views[k].n+'</button>');
    h+='</div><button class="big" data-act="newgame">点 燃 第 一 堆 篝 火</button></div>';

    /* 真实性与玩法：把「还原」和「好玩」的选择权交给玩家 */
    const RT=W.reality;
    h+='<div class="card"><div class="tagline">真 实 性 档 位 · 由 你 定</div>'
      +'<div class="mini">史实永远不改；档位只决定哪些「非史实」内容允许入场。'
      +'趣味来自抉择后果、收集、判读与家族命运，不来自把传说伪装成历史。</div>';
    RT.TIERS.forEach(t=>{
      h+='<button data-tier="'+t.key+'" class="'+(START.reality===t.key?'on':'')+'" '
        +'style="display:block;width:100%;text-align:left;margin-top:8px;padding:10px;border:1px solid '
        +(START.reality===t.key?'var(--gold)':'var(--line)')+';border-radius:10px;background:'
        +(START.reality===t.key?'#33291a':'#1d1811')+';color:var(--ink);font-family:inherit">'
        +'<b style="color:var(--gold)">'+t.name+'</b> <span class="mini">'+t.short+'</span>'
        +'<div class="mini" style="margin-top:5px">'+t.desc+'</div>'
        +'<div class="mini" style="color:var(--blue);margin-top:4px">'+t.note+'</div></button>';
    });
    h+='<div class="hr"></div><div class="tagline">玩 法 模 式</div><div class="viewsel" style="flex-wrap:wrap">';
    RT.MODES.forEach(m=>h+='<button data-mode="'+m.key+'" class="'+(START.modeKey===m.key?'on':'')+'">'+m.name+'</button>');
    h+='</div><div class="mini" style="margin-top:6px">'
      +esc(RT.mode(START.modeKey).desc)+'</div>';
    h+='<div class="hr"></div><div class="tagline">局 时 长</div><div class="viewsel" style="flex-wrap:wrap">';
    RT.LENGTHS.forEach(l=>h+='<button data-len="'+l.key+'" class="'+(START.lengthKey===l.key?'on':'')+'">'+l.name+'</button>');
    h+='</div><div class="mini" style="margin-top:6px">'+esc(RT.length(START.lengthKey).desc)+'</div>';
    h+='<div class="hr"></div><div class="tagline">史 料 密 度</div><div class="viewsel" style="flex-wrap:wrap">';
    RT.DENSITIES.forEach(d=>h+='<button data-dens="'+d.key+'" class="'+(START.density===d.key?'on':'')+'">'+d.name+'</button>');
    h+='</div><div class="mini" style="margin-top:6px">'+esc(RT.density(START.density).desc)
      +'　（只改史实出现频率，不改任何史实内容）</div></div>';
    const ent=D.entities.entities.find(x=>x.id===START.entity)||D.entities.entities[0];
    h+='<div class="card"><div class="tagline">或 · 代 入 真 实 血 脉</div>'
      +'<div class="mini">从考据年表的「建立」之年入局，沿建立 → 扩张 → 鼎盛 → 转折 → 衰落 → 终结六阶段走完一个真实王朝／家族／文明。'
      +'史实节点与出处原样呈现，抉择仍属推演；人物、工艺、文化、商业会以「文明」条目同时抵达。</div>'
      +'<div class="sel" style="margin-top:10px">';
    D.entities.entities.forEach(e=>{
      h+='<button data-ent="'+e.id+'" class="'+(ent.id===e.id?'on':'')+'">'+esc(e.name)
        +'<div class="mini" style="color:var(--dim);margin-top:4px">'+E.fmtShort(e.startYear)+' — '+E.fmtShort(e.endYear)+' · '+D.regions[e.region].n+'</div></button>';
    });
    h+='</div><button class="big" data-act="newreal">代 入 '+esc(ent.name)+' ▸</button></div>';
    const chRegions=W.succession.available();
    const co=W.succession.coexisting();
    const ch=D.succession.chains[START.chainRegion]||D.succession.chains[chRegions[0]]
      ||{region:'huaxia',title:'朝代更迭',entities:[],from:-5000,to:2026,totalTurns:0};
    h+='<div class="card"><div class="tagline">或 · 朝 代 长 河（连 续 更 迭）</div>'
      +'<div class="mini">一局连走多个真实王朝，前朝终结自动接下一朝；间朝单独标出。'
      +'真实人物按其活动年代随朝代登场，每朝一卷、卷末出更迭卡。</div>';
    if(chRegions.length){
      h+='<div class="viewsel" style="margin-top:10px">';
      chRegions.forEach(k=>h+='<button data-chain="'+k+'" class="'+(ch.region===k?'on':'')+'">'+D.regions[k].n+'</button>');
      h+='</div>';
      h+='<div class="mini" style="margin-top:8px">'+esc(ch.title)+'：';
      ch.entities.forEach((e,i)=>{
        if(i)h+=' <span style="color:var(--dim)">→</span> ';
        h+=esc(e.name);
      });
      h+='<br>'+E.fmtShort(ch.from)+' — '+E.fmtShort(ch.to)+'，共 '+ch.entities.length+' 朝、'+ch.totalTurns+' 笔。</div>';
      h+='<button class="big" data-act="newchain">走 一 遍 朝 代 长 河 ▸</button>';
    }
    h+='<div class="hr"></div><div class="mini">其他文明圈暂不排成线性王朝链：'
      +Object.keys(co).map(k=>D.regions[k].n+'（'+co[k].entities.length+' 个政权'+(co[k].entities.length>1?'纪年互相重叠':'')+'）').join('、')
      +'。政权并立时硬串成「前后相续」会失真，故只列并存，不伪造更迭。</div></div>';
    h+='<div class="mini center" style="margin-top:14px">单文件 · 无联网 · 自动存档于本机<br>'
      +D.civilization.dimensions.length+' 维 / '+D.civilization.items.length+' 条文明条目 · '
      +D.geoclimate.units.length+' 地理单元 / '+D.geoclimate.events.length+' 气候事件 · '
      +D.fringe.texts.length+' 文本传统 / '+D.fringe.hypotheses.length+' 未证实假说（默认关闭）</div>';
    app.innerHTML=h;$('tabs').innerHTML='';
    const rerender=()=>renderStart(app);
    app.querySelectorAll('[data-reg]').forEach(b=>b.addEventListener('click',()=>{START.reg=b.dataset.reg;rerender();}));
    app.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{START.view=b.dataset.v;rerender();}));
    app.querySelectorAll('[data-ent]').forEach(b=>b.addEventListener('click',()=>{START.entity=b.dataset.ent;rerender();}));
    app.querySelectorAll('[data-chain]').forEach(b=>b.addEventListener('click',()=>{START.chainRegion=b.dataset.chain;rerender();}));
    app.querySelectorAll('[data-tier]').forEach(b=>b.addEventListener('click',()=>{START.reality=b.dataset.tier;rerender();}));
    app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{START.modeKey=b.dataset.mode;rerender();}));
    app.querySelectorAll('[data-len]').forEach(b=>b.addEventListener('click',()=>{START.lengthKey=b.dataset.len;rerender();}));
    app.querySelectorAll('[data-dens]').forEach(b=>b.addEventListener('click',()=>{START.density=+b.dataset.dens;rerender();}));
    app.querySelectorAll('[data-diff]').forEach(b=>b.addEventListener('click',()=>{
      START.difficulty=b.dataset.diff;
      if(!START.tutManual)START.tutorialOn=W.difficulty.tier(START.difficulty).tutorialDefault;
      rerender();
    }));
    app.querySelectorAll('[data-tuton]').forEach(b=>b.addEventListener('change',()=>{
      START.tutorialOn=b.checked;START.tutManual=true;rerender();
    }));
    const startCfg=()=>E.configure({reality:START.reality,modeKey:START.modeKey,
      lengthKey:START.lengthKey,density:START.density,difficulty:START.difficulty});
    /* 开局教程开关：fresh 已按难度给默认值，这里按玩家勾选覆盖 */
    const applyTut=()=>{const S=E.state();if(!S||!W.tutorial)return;
      W.tutorial.setOn(S,!!START.tutorialOn);
      if(!START.tutorialOn){S.tutorial.done=true;S.tutorial.idx=W.tutorial.STEPS.length-1;}
    };
    app.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.act;
      if(a==='newgame'){startCfg();E.fresh(START.reg,START.view);applyTut();E.step();TAB='main';render();}
      else if(a==='newreal'){startCfg();E.freshEntity(START.entity,START.view);applyTut();E.step();TAB='main';render();}
      else if(a==='newchain'){startCfg();E.freshSuccession(START.chainRegion,START.view);applyTut();E.step();TAB='main';render();}
      else if(a==='resume'){
        const c=E.load();
        if(c){E.setState(c);TAB='main';render();}
      }
    }));
  }
  W.ui={render:render,renderStart:renderStart,setTab:t=>{TAB=t;},getTab:()=>TAB,
    setStart:(k,v)=>{START[k]=v;},getStart:()=>START};
  if(typeof module!=='undefined'&&module.exports)module.exports=W.ui;
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));


/* ===== src/main.js ===== */
/* main.js —— 组装与启动 */
(function(W){
  'use strict';
  const E=W.engine,U=W.ui;
  function boot(){
    if(typeof document==='undefined')return;
    if(window.__WQN_BAD__)return;   /* 数据自检未通过，页面已给出人话提示 */
    let fresh=false;
    try{fresh=new URLSearchParams(location.search).get('new')==='1';}catch(e){}
    const c=E.load();
    if(c&&!fresh){E.setState(c);U.render();}
    else U.renderStart(document.getElementById('app'));
  }
  W.main={boot:boot};
  boot();
})((typeof window!=='undefined'?window:globalThis).WQN=((typeof window!=='undefined'?window:globalThis).WQN||{}));

</script>
</body>
